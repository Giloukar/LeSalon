/* Une table en perspective, avec la main du joueur au premier plan. */
.scene-heading,.scene-seats,.scene-rail,.scene-rest,.scene-atmosphere{display:none}
.scene-toggle.active{color:var(--lime);background:#344530;border:1px solid #87996a}
html[data-immersive='on'] .game-layout{padding-top:22px}
html[data-immersive='on'] .scene-surface{position:relative;isolation:isolate;margin-top:4px;padding:0 9px 18px;--scene-tilt:10deg}
html[data-immersive='on'] .scene-atmosphere{display:block;position:absolute;inset:28px -12px 0;z-index:-1;border-radius:40% 40% 30px 30px;background:radial-gradient(ellipse at 50% 0,#809d492b,transparent 65%),linear-gradient(120deg,#18231a,#101c17);box-shadow:0 35px 65px -30px #0009;pointer-events:none}
html[data-immersive='on'] .scene-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -6px 21px;color:#9cae96;font-size:9px;letter-spacing:.5px}
.scene-heading>span:first-child{display:flex;align-items:center;gap:7px;font-size:8px;letter-spacing:1.7px;color:var(--scene-accent)}
.scene-heading i{width:5px;height:5px;border-radius:50%;background:var(--scene-accent);box-shadow:0 0 10px var(--scene-accent)}
html[data-immersive='on'] .scene-seats{display:flex;justify-content:center;flex-wrap:wrap;gap:12px 25px;margin:0 0 3px;position:relative;z-index:1;min-height:30px}
.scene-seat{display:flex;align-items:center;justify-content:center;gap:7px;font-size:10px;color:#a7b49c;position:relative;max-width:130px;min-height:27px}
.scene-seat>span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scene-seat.current{color:#e8efd1}
.scene-seat-dot{height:7px;width:7px;border:1px solid var(--player-color);border-radius:50%;flex-shrink:0}
.scene-seat.current .scene-seat-dot{background:var(--player-color);box-shadow:0 0 15px #dce6a155}
.scene-mini-hand{position:relative;width:26px;height:21px;display:inline-block;flex-shrink:0;margin-left:3px}
.scene-mini-hand i{position:absolute;left:8px;top:2px;width:13px;height:19px;border:1px solid #b0b799;border-radius:2px;background:repeating-linear-gradient(45deg,#415741 0 2px,#374c34 2px 4px);box-shadow:0 2px 2px #0006}
.scene-mini-hand i:first-child{transform:translateX(-7px) rotate(-17deg)}
.scene-mini-hand i:last-child{transform:translateX(7px) rotate(17deg)}
html[data-immersive='on'] .scene-surface>.felt{transform:perspective(1100px) rotateX(var(--scene-tilt));transform-origin:50% 73%;min-height:315px;border-radius:31% 31% 14% 14% / 14% 14% 9% 9%;padding:33px 28px 40px;border:9px solid #4a4831;outline:1px solid #79725577;background:radial-gradient(ellipse at 50% 27%,#496849,#2b4c35 51%,#203c2b 90%);box-shadow:inset 0 0 0 2px #a4ad6766,inset 0 0 0 5px #183621,inset 0 -20px 45px #091e1e88,0 7px 0 #2c2b20,0 12px 0 #171d16,0 26px 25px -15px #000a;overflow:clip}
html[data-immersive='on'] .scene-surface>.felt:before{border-radius:inherit;background:repeating-linear-gradient(45deg,#ffffff03 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 0,#e9e7a90b,transparent 70%)}
html[data-immersive='on'] .scene-surface>.felt:after{content:'';position:absolute;inset:11px;pointer-events:none;border:1px dashed #bcbd8735;border-radius:inherit}
html[data-immersive='on'] .felt .playing-card{box-shadow:0 3px 0 #bbb297,0 8px 12px #061b1666}
html[data-immersive='on'] .center-piles{gap:45px}
html[data-immersive='on'] .scene-rail{display:flex;position:relative;align-items:center;justify-content:center;height:21px;margin:3px 4% -8px;color:#b7b49288;font-size:6px;letter-spacing:4px;pointer-events:none}
html[data-immersive='on'] .scene-rail>span:not(.scene-rest){position:relative;z-index:2}
html[data-immersive='on'] .hand-panel{position:relative;isolation:isolate;border-radius:24px 24px 65px 65px / 20px 20px 24px 24px;background:radial-gradient(ellipse at 50% 0,#3c52343d,transparent 70%),linear-gradient(180deg,#203125,#17271f);border-color:#64755266;border-top:2px solid #93a37388;box-shadow:inset 0 -8px 10px #0b171b77,0 16px 40px -22px #000b;padding-bottom:27px;overflow:visible}
html[data-immersive='on'] .hand-top{position:relative;z-index:2;margin-bottom:17px}
html[data-immersive='on'] .hand{position:relative;z-index:2;padding:12px 7px 10px;row-gap:23px}
html[data-immersive='on'] .hand>.playing-card{rotate:var(--fan-angle,0deg);translate:0 var(--fan-rise,0px);transform-origin:50% 130%;box-shadow:0 3px 0 #b7ad91,0 10px 12px #08180b88;transition:transform .2s,box-shadow .2s,rotate .2s,translate .2s}

html[data-immersive='on'] .hand>.playing-card:focus-visible{outline:3px solid #edf8bd;outline-offset:4px;z-index:4}
html[data-immersive='on'] .hand-help{position:relative;z-index:2;padding:0 28px}
html[data-immersive='on'] .scene-rest{display:block;position:absolute;bottom:-31px;width:72px;height:123px;opacity:.6;pointer-events:none;z-index:0;filter:drop-shadow(0 6px 5px #0006)}

.scene-rest.left{left:5px;transform:rotate(23deg)}

html[data-immersive='on'] .scene-rail .scene-rest{bottom:-29px;width:66px;height:112px;opacity:.75}
html[data-immersive='on'] .scene-rail .scene-rest.left{left:-8px}
html[data-immersive='on'] .scene-rail .scene-rest.right{right:-8px}

.catalog-empty h3{font:25px var(--serif)}
.catalog-empty p{max-width:440px;margin:12px auto 20px;color:#bdcbb8;line-height:1.7}
.catalog-recent{display:flex;gap:18px;align-items:center;margin:22px 0;padding:18px 20px;border:1px solid #536846;border-radius:15px;background:linear-gradient(110deg,#263922,#19281f)}
.catalog-recent>div:first-child{flex-shrink:0}.catalog-recent strong{font:21px var(--serif);display:block}.catalog-recent>div>span{color:#c0cdb6;font-size:11px}
.recent-games{display:flex;gap:8px;flex-wrap:wrap;min-width:0}.recent-games button{min-height:44px;padding:10px 13px;background:#14251d;border:1px solid #526649;border-radius:10px;text-align:left;font-size:12px}.recent-games button span{color:var(--lime);margin-left:5px}
.catalog-item:focus-within{z-index:3}
@media(max-width:600px){.catalog-tools{gap:12px;padding:14px}.catalog-tools label{flex-basis:calc(50% - 12px)}.catalog-favorites{flex-basis:100%}.catalog-recent{align-items:start;flex-direction:column;gap:12px}.catalog-results{font-size:11px}.catalog-star{right:10px;top:10px}.catalog-empty{padding:30px 14px}}
@media(prefers-reduced-motion:reduce){.catalog-star{transition:none}.catalog-star:hover{transform:none}}
@media(max-width:360px){.catalog-tools label{flex-basis:100%}}
html[data-motion="off"] .catalog-star{transition:none}html[data-motion="off"] .catalog-star:hover{transform:none}

.setup-recap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 14px;margin:4px 0 8px;padding:12px 14px;border:1px solid #5c704b;border-radius:12px;background:#263821;color:#e3edce;font-size:12px}
.setup-recap>span{display:flex;align-items:center;gap:7px}.setup-recap .icon{width:16px;height:16px}
.setup-remember-note{font-size:11px;color:#b7c9ad;line-height:1.6;margin:0 0 16px}
.setup-rules{margin:0 0 20px;border:1px solid #4c6045;border-radius:12px;background:#16271d;overflow:hidden}
.setup-rules summary{cursor:pointer;min-height:48px;padding:13px 15px;color:#e1ecc6;font-size:13px;list-style-position:inside;line-height:1.6}
.setup-rules summary>span{display:block;margin-left:18px;color:#b7c9ad;font-size:11px}
.setup-rules[open] summary{border-bottom:1px solid #43583a;background:#273c25}
.setup-rules-body{padding:16px;color:#d4dfcc;font-size:12px;line-height:1.85}.setup-rules-body>p{color:#aebeab;margin-bottom:12px}.setup-rules-body ol{padding-left:20px;margin:0}.setup-rules-body li+li{margin-top:12px}
.setup-rules summary:focus-visible{outline-offset:-4px;border-radius:10px}
@media(max-width:400px){.setup-recap{font-size:11px;padding:11px}.setup-rules-body{padding:13px}}

.auction-table,.box-table{display:block;padding:24px;background:radial-gradient(ellipse at top,#3d5840,#1c352b);min-height:330px}
.auction-top{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#d9e1c5;flex-wrap:wrap}.auction-prize{text-align:center;margin:20px auto;color:#f4daab;display:grid;gap:4px}.auction-prize>span:first-child{font-size:10px;letter-spacing:2px}.auction-prize strong{font:66px Georgia;line-height:1.1}.auction-prize>span:last-child{font-size:12px}
.auction-bids{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px}.auction-seat{text-align:center;display:grid;justify-items:center;gap:8px;padding:12px 5px;border:1px solid #70815c66;border-radius:12px;background:#10291c88;min-width:0}.auction-seat>strong{font-size:12px;max-width:100%;overflow-wrap:anywhere}.auction-seat>span{font-size:10px;color:#c5d2b9}.auction-seat.won{border-color:#f3d38c;background:#57532c}.auction-number{width:54px;height:76px;background:#f4edd6;color:#233d30;border-radius:8px;border:2px solid #d9cda7;display:grid;place-items:center;font:bold 29px Georgia;box-shadow:0 4px 0 #b3a783;transition:transform .2s,background .2s;flex-shrink:0}.auction-number.sealed{background:repeating-linear-gradient(45deg,#294335,#294335 4px,#314d3c 4px,#314d3c 8px);color:#dfd6ac}.auction-message{margin-top:18px;text-align:center;color:#e5e7c9;font-size:12px}.auction-history{margin-top:15px;font-size:11px;color:#d9e1c5}.auction-history summary{cursor:pointer;min-height:44px;padding:12px}.auction-history p{padding:10px}
.auction-rack{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:16px 4px}.auction-rack .auction-number{cursor:pointer}.auction-rack .auction-number.selected{transform:translateY(-7px);outline:3px solid var(--lime);outline-offset:3px;background:#e4edba}.auction-art{position:relative}.auction-art>b{position:absolute;font:60px Georgia;color:#f3df9d;left:60px;top:-45px}.box-art{display:flex;align-items:center;gap:7px}.box-art>span{background:#d6b37c;color:#3e3022;padding:15px 9px;border-radius:7px;font:26px Georgia}.box-art>.die{position:absolute;bottom:14px;right:25px;transform:rotate(12deg)}
.box-tiles{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;margin:28px 0}.box-tile{min-width:0;min-height:74px;background:linear-gradient(#e5c798,#c4a16b);border:1px solid #f2d5a4;border-bottom:6px solid #997447;border-radius:8px;color:#3a2d1c;font:bold 28px Georgia;position:relative;transition:transform .2s,background .2s}.box-tile.selected{outline:3px solid var(--lime);outline-offset:3px;transform:translateY(-6px)}.box-tile.closed{opacity:1;background:#1e3b2e;border-color:#506c51;color:#8fa58b;transform:scale(.91)}.box-tile small{position:absolute;bottom:2px;right:4px;font:12px system-ui}.box-dice{display:flex;align-items:center;justify-content:center;gap:20px;min-height:86px;color:#bfd1b8;font-size:13px}.box-total{text-align:center;margin:16px 0;font-size:15px;color:#eef2d7}.box-hint{text-align:center;color:#b9cdb1;font-size:11px;line-height:1.7}
@media(max-width:650px){.auction-table,.box-table{padding:16px}.auction-bids{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.auction-seat{padding:9px 3px}.auction-seat>strong{font-size:10px}.auction-number{width:46px;height:65px;font-size:25px}.auction-rack{gap:10px}.box-tiles{grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.box-tile{min-height:62px}.auction-top{font-size:11px}}
@media(max-width:360px){.auction-bids{grid-template-columns:repeat(2,minmax(0,1fr))}.box-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
html[data-motion="off"] .auction-number,html[data-motion="off"] .box-tile{transition:none}@media(prefers-reduced-motion:reduce){.auction-number,.box-tile{transition:none}}

'use strict';
const SUITS=['S','H','D','C'];
const SYMBOLS={S:'♠',H:'♥',D:'♦',C:'♣'};
const SUIT_NAMES={S:'pique',H:'cœur',D:'carreau',C:'trèfle'};

const GAMES={
 huit:{name:'8 américain',short:'8 américain',tag:'Un classique qui a du répondant.',desc:'Changez la couleur, renversez le jeu et videz votre main.',category:'cartes',kind:'Dynamique',time:'10–15 min',min:2,max:6,accent:'#b0c9a0',bg:'#395a43',symbol:'8',rules:['But : être le premier à poser toutes ses cartes. Chacun reçoit 7 cartes.','Posez une carte de la même couleur (pique, cœur, carreau ou trèfle) ou de la même valeur que la défausse. Le 8 se pose sur tout et permet de choisir la couleur.','Un as fait piocher 2 cartes au suivant et saute son tour, le 7 saute un tour, le valet inverse le sens (à deux, il saute un tour). Les pénalités ne se cumulent pas.','Vous pouvez piocher une carte. Si elle est jouable, posez-la ou passez ; les autres cartes attendent votre prochain tour.','Avant de passer de 2 cartes à 1, appuyez sur « Carte ! ». Un oubli ajoute 2 cartes. Une main vide gagne immédiatement.']},
 oie:{name:"Jeu de l’oie",short:"Jeu de l’oie",tag:'Le hasard fait bien les choses. Parfois.',desc:'Deux dés, 63 cases et quelques détours inattendus.',category:'plateau',kind:'Chance',time:'10–20 min',min:2,max:6,accent:'#dfc296',bg:'#725439',symbol:'⚄',rules:['Atteignez exactement la case 63. Lancez deux dés à chaque tour. Un dépassement vous fait reculer du nombre de cases en trop.','Sur une oie (5, 9, 14, 18, 23, 27, 32, 36, 41, 45, 50, 54, 59), avancez à nouveau du total des dés ; après un rebond, reculez.','Pont (6) : allez en 12. Auberge (19) : passez 2 tours. Labyrinthe (42) : retour en 30. Tête de mort (58) : retour au départ.','Puits (31) et prison (52) : attendez qu’un autre joueur vous remplace, au maximum 3 tours dans cette variante.','Au premier lancer, un 9 obtenu avec 3 + 6 mène en 26 ; avec 4 + 5, en 53. Plusieurs pions peuvent partager une case ordinaire.']},
 cactus:{name:'Le Cactus',short:'Cactus',tag:'Gardez les bonnes cartes en tête.',desc:'Quatre cartes cachées. Votre mémoire fait la différence.',category:'cartes',kind:'Mémoire',time:'10–15 min',min:2,max:6,accent:'#d1d19d',bg:'#666b3d',symbol:'✳',rules:['But : terminer à 6 points maximum. Pour gagner son annonce, il faut aussi être strictement sous chaque adversaire. Chacun a 4 cartes cachées ; regardez vos 2 cartes du bas au départ.','À votre tour, piochez une carte du paquet ou prenez celle de la défausse. Échangez-la avec une de vos cartes, ou jetez-la si elle vient du paquet.','Variante de cette table : quatre cartes conservées, sans défausse éclair. Une carte piochée au paquet puis jetée donne un pouvoir : 7 ou 8, regardez une carte à vous ; 9 ou 10, regardez une carte adverse ; valet ou dame, échangez à l’aveugle une de vos cartes avec une carte adverse. Vous pouvez ignorer le pouvoir.','As = 1 ; de 2 à 10 = valeur de la carte ; valet et dame = 10 ; tous les rois = 0.','Au début de votre tour, annoncez « Cactus ! » si vous pensez avoir 6 points ou moins. Chaque adversaire joue encore un tour. Au décompte final, l’annonceur perd en cas de dépassement ou si un adversaire a autant ou moins. Parmi les autres, le minimum à 6 ou moins gagne (ex æquo possibles). Si aucun score n’est admissible, personne ne gagne.']},
 president:{name:'Le Président',short:'Président',tag:'Une main pour changer la hiérarchie.',desc:'Montez les enchères et prenez la tête de la table.',category:'cartes',kind:'Stratégie',time:'10–20 min',min:2,max:6,accent:'#c5b7dc',bg:'#534766',symbol:'♛',rules:['Débarrassez-vous de toutes vos cartes. L’ordre croissant est 3, 4, …, 10, valet, dame, roi, as, 2.','Le premier pose une carte ou plusieurs cartes de même valeur. Il faut répondre avec le même nombre de cartes, d’une valeur supérieure, ou passer. Une nouvelle pose réautorise tous les joueurs à répondre.','Lorsque tous les autres joueurs encore en jeu passent, le dernier à avoir posé ouvre un nouveau pli. S’il a terminé, le suivant encore en jeu ouvre.','Variante révolution : un carré peut être posé sur tout. Il vide le pli et inverse entièrement l’ordre des valeurs, jusqu’au prochain carré.','Le premier est Président. À la manche suivante, le dernier lui donne ses 2 meilleures cartes et reçoit ses 2 moins bonnes. À 4 joueurs ou plus, les deux rangs intermédiaires échangent aussi 1 carte (sauf s’ils font partie du premier échange). Les échanges sont automatiques.']},
 menteur:{name:'Le Menteur',short:'Menteur',tag:'Un peu de culot, beaucoup de bluff.',desc:'Annoncez, bluffez… et choisissez qui croire.',category:'cartes',kind:'Bluff',time:'10–20 min',min:2,max:6,accent:'#afced1',bg:'#3d6065',symbol:'?',rules:['Videz votre main en posant de 1 à 4 cartes, face cachée. La valeur annoncée suit le cycle as, 2, 3, …, roi, puis as. Vous pouvez dire vrai ou bluffer.','Dans cette variante, le joueur suivant peut contester avec « Menteur ! » avant de jouer, ou accepter l’annonce.','Si une carte du dernier coup a une autre valeur que l’annonce, le menteur ramasse tout le tas. Sinon, celui qui a contesté ramasse. Les cartes contestées sont révélées.','Une fois l’annonce résolue, le joueur suivant joue la valeur suivante, même s’il vient de ramasser.','Une dernière pose ne gagne qu’une fois acceptée, ou après une accusation injustifiée. Un bluff démasqué ne peut pas gagner.']},
 vingtetun:{name:'Le Vingt-et-un',short:'Vingt-et-un',tag:'Savoir quand s’arrêter, tout un art.',desc:'Approchez 21 et défiez la banque, sans le dépasser.',category:'cartes',kind:'Prise de risque',time:'10–15 min',min:1,max:6,accent:'#ddca91',bg:'#3f6154',symbol:'21',rules:['Vous commencez avec 1 000 jetons fictifs. Après 15 mains, le plus de jetons gagne. Aucun argent réel.','Misez de 10 à 200 jetons (ou votre solde restant s’il est inférieur à 10). Vous recevez 2 cartes, la banque aussi, dont une cachée.','Les figures valent 10 ; l’as vaut 1 ou 11. Tirez une carte ou restez. Au-delà de 21, vous perdez la mise. Sur vos 2 premières cartes, « Doubler » double la mise et donne exactement une dernière carte. Pas de séparation de paires.','La banque tire sous 17 et reste à 17, même avec un as compté 11. Un blackjack naturel (as + carte de valeur 10) bat un 21 en 3 cartes ou plus.','Victoire : la mise est rendue avec un gain égal. Blackjack naturel : gain de 1,5 fois la mise. Égalité : mise rendue. Les joueurs sans jetons quittent les mains suivantes.']},
 pouilleux:{name:'Le Pouilleux',short:'Pouilleux',tag:'Une dame. Un peu trop de suspense.',desc:'Formez des paires et évitez la dernière dame de pique.',category:'cartes',kind:'Chance & bluff',time:'5–10 min',min:2,max:6,accent:'#dbb2bc',bg:'#734b57',symbol:'♠',rules:['Les 3 dames autres que la dame de pique sont retirées du paquet. Les 49 cartes restantes sont distribuées.','Les paires de même valeur sont défaussées automatiquement, quelle que soit leur couleur. La dame de pique ne peut former aucune paire.','À votre tour, choisissez une carte cachée chez le prochain joueur qui a encore des cartes. Toute nouvelle paire est retirée ; votre main est remélangée.','Une main vide vous met à l’abri. Les autres continuent à jouer. Le dernier joueur avec la dame de pique perd ; tous les autres gagnent.']},
 rummikub:{name:'Le Rummikub',short:'Rummikub',tag:'Chaque tuile trouve sa place.',desc:'Créez des suites, combinez et réinventez la table.',category:'plateau',kind:'Stratégie',time:'15–30 min',min:2,max:4,accent:'#d3c0a0',bg:'#70614b',symbol:'123',rules:['Version classique à 2–4 joueurs, sans chronomètre. 106 tuiles : 2 exemplaires de 1 à 13 dans 4 couleurs et 2 jokers. Chacun commence avec 14 tuiles. Videz votre chevalet.','Une combinaison est un groupe de 3 ou 4 tuiles de même nombre dans des couleurs différentes, ou une suite d’au moins 3 nombres consécutifs de même couleur. Pas de boucle 13 → 1.','Votre première pose doit totaliser au moins 30 points, uniquement avec vos tuiles, en une ou plusieurs combinaisons. Un joker prend la valeur qu’il remplace.','Après votre première pose, vous pouvez recomposer toute la table, y compris déplacer un joker. Toutes les combinaisons doivent être valides à la fin ; aucune tuile qui était déjà sur la table ne peut revenir sur votre chevalet.','Sélectionnez des tuiles, puis « Nouveau groupe » ou « Ajouter ici ». « Défaire le tour » restaure le départ. « Valider le tour » exige au moins une tuile posée. Piocher annule le chantier et termine le tour.','Les couleurs portent aussi des repères : rouge ●, bleu ◆, ambre ▲, noir ■. Si la pioche est épuisée et que tous passent, le plus petit total restant gagne (joker = 30).']}
};
// Small, host-authoritative actions: no frame stream and no latency-based scoring.
const ARCADE_IDS=['echo','anagrammes','ballon'];
const WORD_BANK=[['PLANETE','Dans le système solaire'],['GUITARE','Instrument à cordes'],['CASCADE','Une chute dans la nature'],['PIRATE','Aventurier des mers'],['NUAGE','Dans le ciel'],['VOLCAN','Montagne de feu'],['CITRON','Agrume jaune'],['FUSEE','Véhicule spatial'],['JUNGLE','Forêt tropicale'],['DAUPHIN','Mammifère marin'],['CHOCOLAT','Douceur au cacao'],['PAPILLON','Insecte aux grandes ailes'],['BOUSSOLE','Elle indique le nord'],['LANTERNE','Elle éclaire la nuit'],['PINGOUIN','Oiseau marin'],['TORNADE','Tourbillon de vent'],['CROISSANT','Viennoiserie'],['LICORNE','Animal imaginaire'],['ORCHESTRE','Ensemble de musiciens'],['COQUILLAGE','Trésor de plage'],['MONTAGNE','Sommet à gravir'],['HAMAC','Lit suspendu'],['TAMBOUR','Instrument à percussion'],['ROBOT','Machine programmable'],['ETOILE','Elle brille la nuit'],['BATEAU','Il navigue'],['RENARD','Animal à la queue rousse'],['DIAMANT','Pierre précieuse'],['IGLOO','Abri de neige'],['SORCIERE','Personnage au balai']];
Object.assign(GAMES,{
 echo:{name:'Écho néon',short:'Écho néon',tag:'Les lumières passent. La mémoire reste.',desc:'Retenez la séquence lumineuse et réveillez les bonnes couleurs.',category:'arcade',kind:'Mémoire lumineuse',time:'3–5 min',min:2,max:4,accent:'#a9e4da',bg:'#315b64',symbol:'◈',rules:['Cinq manches. Chaque joueur reçoit une séquence de même longueur : de 3 à 7 signaux.','Regardez les signaux dans l’ordre, puis appuyez sur « À moi ». Ils sont alors cachés. Reproduisez-les avec les quatre boutons numérotés.','Chaque signal correct rapporte 1 point ; une séquence complète ajoute 3 points. La première erreur termine votre tour.','Chaque joueur joue une fois par manche. Le plus grand score final gagne ; les égalités sont partagées. Aucun chronomètre : la latence ne coûte aucun point.']},
 anagrammes:{name:'Lettres en folie',short:'Lettres en folie',tag:'Un mot se cache dans le désordre.',desc:'Assemblez les lettres, suivez l’indice et trouvez le mot mystère.',category:'arcade',kind:'Jeu de mots',time:'3–6 min',min:2,max:4,accent:'#eec39c',bg:'#755146',symbol:'Aa',rules:['Cinq manches ; chaque joueur reçoit un mot du même nombre de lettres. Remettez toutes les lettres dans l’ordre pour répondre à l’indice.','Touchez les lettres, ou saisissez votre réponse. Les accents, espaces et majuscules sont ignorés. Le mot attendu est celui de l’indice.','Trois essais : 5 points au premier, 3 au deuxième, 1 au dernier. « Passer » révèle le mot et termine le tour sans point.','Après chaque réponse, « Continuer » passe au joueur suivant. Le score le plus élevé après cinq manches gagne, avec égalités possibles. Pas de limite de temps.']},
 ballon:{name:'Bulle ou double',short:'Bulle ou double',tag:'Encore un souffle… ou la sagesse ?',desc:'Gonflez le ballon, faites monter la cagnotte et sortez à temps.',category:'arcade',kind:'Stop ou encore',time:'2–4 min',min:2,max:4,accent:'#e9aacb',bg:'#6a4662',symbol:'◉',rules:['Cinq manches ; chaque joueur a un ballon par manche. Gonfler avec succès ajoute 10 points à la cagnotte du tour.','Le risque d’éclatement au prochain souffle est affiché : 10 %, puis 20 %, et ainsi de suite jusqu’à 90 % maximum. Chaque souffle est un nouveau tirage indépendant.','« Encaisser » ajoute la cagnotte à votre score. Un éclatement efface seulement la cagnotte du tour ; les points déjà encaissés restent acquis.','Après le résultat, « Continuer » passe au joueur suivant. Le score final le plus élevé gagne, avec égalités possibles. En ligne, les tirages sont faits par l’hôte.']}
});
function arcadeTurn(s){
 s.phase='play';s.feedback='';s.input=[];s.attempts=0;s.pot=0;s.pumps=0;s.burst=false;
 if(EXTRA_IDS.includes(s.id)){extraTurn(s);return;}
 if(s.id==='echo'){s.sequence=Array.from({length:s.stage+2},()=>Math.floor(Math.random()*4));s.phase='watch';}
 if(s.id==='anagrammes'){
  const length=[5,6,7,8,9][s.stage-1],all=WORD_BANK.map((w,i)=>({w,i})).filter(x=>x.w[0].length===length),fresh=all.filter(x=>!s.usedWords.includes(x.i));
  const pick=shuffle(fresh.length?fresh:all)[0];s.usedWords.push(pick.i);s.answer=pick.w[0];s.clue=pick.w[1];s.letters=shuffle([...s.answer]);
  if(s.letters.join('')===s.answer)s.letters.push(s.letters.shift());
 }
}
function createArcade(s){s.stage=1;s.played=0;s.usedWords=[];arcadeTurn(s);return s;}
function arcadeResult(s,message){s.phase='result';s.feedback=message;say(s,player(s).name+' : '+message);}
function arcadeNext(s){s.played++;s.moves++;if(s.played>=s.players.length*5){s.totals=s.players.map(p=>p.score);const top=Math.max(...s.totals);finish(s,s.players.map((p,i)=>i).filter(i=>s.totals[i]===top),'Cinq manches terminées. Meilleur score : '+top+' points.');return;}s.stage=Math.floor(s.played/s.players.length)+1;s.turn=next(s);arcadeTurn(s);}
function normalizeWord(value){return String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z]/g,'');}
function playArcade(s,a){
 const p=player(s);
 if(s.phase==='result'&&a.type==='continue'){arcadeNext(s);return true;}
 if(EXTRA_IDS.includes(s.id))return playExtra(s,a);
 if(s.id==='echo'){
  if(s.phase==='watch'&&a.type==='memorized'){s.phase='repeat';s.moves++;return true;}
  if(s.phase!=='repeat'||a.type!=='pad'||!Number.isInteger(a.index)||a.index<0||a.index>3)return false;
  const correct=a.index===s.sequence[s.input.length];s.input.push(a.index);s.moves++;
  if(!correct)arcadeResult(s,'Séquence interrompue. '+(s.input.length-1)+' point(s) gagné(s).');
  else{p.score++;if(s.input.length===s.sequence.length){p.score+=3;arcadeResult(s,'Séquence parfaite ! +'+(s.sequence.length+3)+' points.');}}return true;
 }
 if(s.id==='anagrammes'){
  if(s.phase!=='play')return false;
  if(a.type==='giveup'){arcadeResult(s,'Le mot était '+s.answer+'. Aucun point.');return true;}
  if(a.type!=='word'||typeof a.word!=='string'||a.word.length>40||!normalizeWord(a.word))return false;
  s.attempts++;s.moves++;
  if(normalizeWord(a.word)===s.answer){const points=[5,3,1][s.attempts-1];p.score+=points;arcadeResult(s,s.answer+' ! +'+points+' points.');}
  else if(s.attempts===3)arcadeResult(s,'Le mot était '+s.answer+'. Aucun point.');else{s.feedback='Pas encore… '+(3-s.attempts)+' essai(s) restant(s).';say(s,p.name+' cherche encore.');}return true;
 }
 if(s.id==='ballon'){
  if(s.phase!=='play')return false;
  if(a.type==='bank'&&s.pot>0){p.score+=s.pot;arcadeResult(s,'+'+s.pot+' points mis à l’abri.');return true;}
  if(a.type!=='pump')return false;
  const risk=Math.min(90,10+s.pumps*10);s.moves++;s.pumps++;
  if(Math.random()*100<risk){s.burst=true;s.pot=0;arcadeResult(s,'Pop ! La cagnotte s’envole.');}else{s.pot+=10;say(s,p.name+' gonfle : '+s.pot+' points en jeu.');}return true;
 }return false;
}
function arcadeAI(s){
 if(s.phase==='result')return{type:'continue'};
 if(EXTRA_IDS.includes(s.id))return extraAI(s);
 if(s.id==='echo')return s.phase==='watch'?{type:'memorized'}:{type:'pad',index:Math.random()<.86?s.sequence[s.input.length]:(s.sequence[s.input.length]+1)%4};
 if(s.id==='anagrammes')return Math.random()<.65?{type:'word',word:s.answer}:{type:'giveup'};
 return{type:s.pot>=20&&Math.random()<.65?'bank':'pump'};
}

function codeFeedback(secret,guess){
 let exact=0;const a=[],b=[];for(let i=0;i<3;i++){if(secret[i]===guess[i])exact++;else{a.push(secret[i]);b.push(guess[i]);}}
 let near=0;for(const x of b){const j=a.indexOf(x);if(j!==-1){near++;a.splice(j,1);}}return {exact,near};
}
function golfShot(position,angle,power,course){
 let x=position.x,y=position.y,vx=Math.cos(angle*Math.PI/180)*power*.2,vy=Math.sin(angle*Math.PI/180)*power*.2,sunk=false;
 const path=[[x,y]],radius=7;
 for(let step=0;step<440;step++){
  // Substeps prevent tunnelling through a portal or a small obstacle.
  for(let sub=0;sub<3;sub++){
   x+=vx/3;y+=vy/3;
   if(x<17){x=34-x;vx=Math.abs(vx)*.82;}if(x>643){x=1286-x;vx=-Math.abs(vx)*.82;}
   if(y<17){y=34-y;vy=Math.abs(vy)*.82;}if(y>283){y=566-y;vy=-Math.abs(vy)*.82;}
   for(const rock of course.obstacles){const dx=x-rock.x,dy=y-rock.y,d=Math.hypot(dx,dy),limit=rock.r+radius;if(d<limit){const nx=d?dx/d:1,ny=d?dy/d:0,dot=vx*nx+vy*ny;x=rock.x+nx*(limit+.1);y=rock.y+ny*(limit+.1);if(dot<0){vx=(vx-2*dot*nx)*.85;vy=(vy-2*dot*ny)*.85;}}}
   if(Math.hypot(x-course.hole.x,y-course.hole.y)<15){x=course.hole.x;y=course.hole.y;sunk=true;break;}
  }
  vx*=.98;vy*=.98;if(step%6===0||sunk)path.push([+x.toFixed(2),+y.toFixed(2)]);
  if(sunk||Math.hypot(vx,vy)<.13)break;
 }
 path.push([+x.toFixed(2),+y.toFixed(2)]);return {x:+x.toFixed(2),y:+y.toFixed(2),path,sunk};
}

const motionClock=()=>typeof performance!=='undefined'?performance.now():Date.now();
function motionOn(){return motions()&&!document.hidden;}
function motionDuration(ms){return Math.round(ms*(prefs.fast?.7:1));}
function motionCompact(){return (window.innerWidth||1200)<650;}
function motionVisible(r,margin=120){const w=window.innerWidth||1440,h=window.innerHeight||1000;return !!r&&r.width>0&&r.height>0&&r.top<h+margin&&r.left<w+margin&&r.top+r.height>-margin&&r.left+r.width>-margin;}

 const active=el===document.activeElement,value=active&&'value' in el?el.value:null,keepOpen=el.matches('details.log-panel')&&el.hasAttribute('open');

function patchMotionChildren(parent,next){
 const before=[...parent.childNodes],keyed=new Map(),used=new Set();before.forEach(n=>{const key=motionKey(n);if(key)keyed.set(key,n);});

  const key=motionKey(fresh);let keep=key?keyed.get(key):before.find(n=>!used.has(n)&&compatibleNode(n,fresh));

  if(keep){used.add(keep);if(keep!==cursor)parent.insertBefore(keep,cursor);syncMotionNode(keep,fresh);cursor=keep.nextSibling;}
  else{const created=fresh.cloneNode(true);parent.insertBefore(created,cursor);}

function motionLayout(old,now,{path=null,enter=true}={}){
 const jobs=[];let count=0;
 // Read every geometry and base transform before starting any animation.
 for(const [key,r] of now){
  if(path&&key==='pawn-'+S.movedPlayer||!motionVisible(r))continue;
  const previous=old.get(key),base=window.getComputedStyle?.(r.el)?.transform||'none';
  if(previous&&previous.back!==r.back){jobs.push({el:r.el,frames:[{transform:'perspective(700px) rotateY(88deg)',opacity:.15},{transform:base,opacity:1}],duration:430});continue;}
  if(previous&&previous.width&&r.width){const dx=previous.left-r.left,dy=previous.top-r.top,sx=previous.width/r.width,sy=previous.height/r.height;if(Math.abs(dx)+Math.abs(dy)>2||Math.abs(sx-1)>.015){jobs.push({el:r.el,frames:[{transform:`translate3d(${dx}px,${dy}px,0) scale(${sx},${sy}) ${base==='none'?'':base}`},{transform:base}],duration:380});}}
  else if(enter&&/^(c-|t-|cactus-|dealer-|action:setup:)/.test(key)){jobs.push({el:r.el,frames:[{opacity:0,transform:`translate3d(0,14px,0) scale(.97) ${base==='none'?'':base}`},{opacity:1,transform:base}],duration:300,delay:Math.min(count++*24,180)});}
 }
 for(const job of jobs)uiAnimate(job.el,job.frames,{duration:motionDuration(job.duration),delay:motionDuration(job.delay||0),easing:MOTION_SOFT,fill:'backwards'},'layout');
}

function resetHomeMotion(){revealObserver?.disconnect();ambienceObserver?.disconnect();revealObserver=ambienceObserver=null;}
function observeHomeMotion(){
 if(view!=='home')return;revealObserver?.disconnect();
 const targets=[...document.querySelectorAll('.hero-copy,.hero-art,.section-top,.online-feature,.game-card,.how')];
 if(!motionOn()){targets.forEach(el=>el.removeAttribute('data-reveal'));return;}
 const pending=targets.filter(el=>!el.hasAttribute('data-reveal'));
 if(typeof window.IntersectionObserver==='function'){
  revealObserver=new window.IntersectionObserver(entries=>{entries.forEach(({target:el,isIntersecting})=>{if(!isIntersecting)return;el.dataset.reveal='done';revealObserver?.unobserve(el);uiAnimate(el,[{opacity:0,translate:'0 18px'},{opacity:1,translate:'0 0'}],{duration:motionDuration(510),delay:Number(el.dataset.revealDelay||0),easing:MOTION_SOFT,fill:'backwards'},'reveal');});},{rootMargin:'40px 0px',threshold:.08});
  pending.forEach((el,i)=>{el.dataset.reveal='pending';el.dataset.revealDelay=String((i%3)*45);revealObserver.observe(el);});
  // Re-observe elements still pending after a catalogue filter.
  targets.filter(el=>el.dataset.reveal==='pending'&&!pending.includes(el)).forEach(el=>revealObserver.observe(el));
  if(!ambienceObserver){ambienceObserver=new window.IntersectionObserver(entries=>entries.forEach(({target,isIntersecting})=>target.classList.toggle('motion-dormant',!isIntersecting)),{rootMargin:'100px'});const hero=document.querySelector('.hero-art');if(hero)ambienceObserver.observe(hero);}
 }else pending.forEach((el,i)=>{el.dataset.reveal='done';if(motionVisible(el.getBoundingClientRect()))uiAnimate(el,[{opacity:0,translate:'0 12px'},{opacity:1,translate:'0 0'}],{duration:motionDuration(450),delay:Math.min(i*30,180),fill:'backwards'},'reveal');});
}

 const wasOpen=$('dialog').open;cancelDialogMotion();patchMarkup($('dialog'),`<div class="modal-body"><button class="modal-close" data-action="close-modal" aria-label="Fermer">×</button>${html}</div>`);openDialogMotion(wasOpen);

 if(modalKind==='netpause'&&isOnline())setOnlinePause(false);
 const finish=()=>{if($('dialog').open)$('dialog').close();document.documentElement.dataset.dialogOpen='no';modalKind='';if(resume)schedule();};
 closeDialogMotion(finish,!resume);
}

function openRules(id=S?.id){const g=GAMES[id];modal(`<div class="eyebrow">LES RÈGLES DE LA TABLE</div><h2>${g.name}</h2><p class="modal-subtitle">Les variantes jouées ici, pour que tout le monde soit d’accord.</p><ol class="rules-list">${g.rules.map(t=>`<li>${t}</li>`).join('')}</ol><p class="rules-source">${id==='cactus'?'Plafond de cette table : 6 points inclus, annonce stricte. Les pouvoirs sont une variante maison. <a href="https://gamelia.net/blog/regles-cactus-jeu-de-cartes/" target="_blank" rel="noopener noreferrer">Comparer les variantes du Cactus ↗</a>':id==='rummikub'?'<a href="https://rummikub.com/wp-content/uploads/2019/12/2600-English-1.pdf" target="_blank" rel="noopener noreferrer">Règles de l’éditeur ↗</a>':ARCADE_IDS.includes(id)?'Création pour cette table · mêmes règles en solo, en local et en ligne.':'Les variantes employées sont précisées ci-dessus.'}</p><button class="btn full" data-action="close-modal">Compris, on joue ${icon('check')}</button>`,'rules');}
function openSettings(){modal(`<div class="eyebrow">À VOTRE GOÛT</div><h2>Les petits réglages.</h2><p class="modal-subtitle">Un peu d’ambiance, et le rythme qui vous convient.</p><label class="setting-row"><span><strong>Ambiance sonore</strong><p>Cartes, dés et notes de victoire.</p></span><input type="checkbox" class="toggle" id="pref-sound" ${prefs.sound?'checked':''}></label><label class="setting-row"><span><strong>Animations</strong><p>Gestes, distributions, dés et célébrations. Respecte la réduction des mouvements de votre appareil.</p></span><input type="checkbox" class="toggle" id="pref-motion" ${prefs.motion?'checked':''}></label><label class="setting-row"><span><strong>Vue immersive</strong><p>Installez-vous à la table : perspective, cartes en éventail et gestes depuis votre place.</p></span><input type="checkbox" class="toggle" id="pref-immersive" ${immersive()?'checked':''}></label><label class="setting-row"><span><strong>Effets allégés</strong><p>Moins de gestes et de particules pour les appareils moins puissants.</p></span><input type="checkbox" class="toggle" id="pref-light" ${prefs.light?'checked':''}></label><label class="setting-row"><span><strong>Rythme rapide</strong><p>Des gestes plus courts et des adversaires plus rapides.</p></span><input type="checkbox" class="toggle" id="pref-fast" ${prefs.fast?'checked':''}></label><div class="eyebrow" style="margin:27px 0 15px">VOS PARTIES EN SOLO</div><div class="stats-bar"><div><strong>${stats.played}</strong><span>parties terminées</span></div><div><strong>${stats.wins}</strong><span>victoires</span></div><div><strong>${stats.played?Math.round(stats.wins/stats.played*100):0}%</strong><span>de réussite</span></div></div><p class="modal-subtitle">Les statistiques et la sauvegarde restent dans ce navigateur. Les parties entre amis ne comptent pas dans ce bilan.</p><button class="btn full" data-action="close-modal">C’est parfait ${icon('check')}</button>`,'settings');}
let toastSequence=0;
function toast(message){
 const sequence=++toastSequence;clearTimeout(toastTimer);patchMarkup($('toasts'),`<div class="toast" role="status">${esc(message)}</div>`);const el=$('toasts').firstElementChild;
 uiAnimate(el,[{opacity:0,translate:'0 10px'},{opacity:1,translate:'0 0'}],{duration:motionDuration(240),easing:MOTION_SOFT},'toast');
 toastTimer=setTimeout(()=>{if(sequence!==toastSequence)return;uiAnimate(el,[{opacity:1,translate:'0 0'},{opacity:0,translate:'0 8px'}],{duration:motionDuration(180)},'toast',cancelled=>{if(!cancelled&&sequence===toastSequence)$('toasts').replaceChildren();});},3600);
}
function sound(kind='card'){if(!prefs.sound)return;try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const now=audioContext.currentTime;const notes=kind==='win'?[523.25,659.25,783.99,1046.5]:kind==='dice'?[170,260,200]:kind==='error'?[160]:[370,520];notes.forEach((freq,i)=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.connect(gain);gain.connect(audioContext.destination);osc.type=kind==='dice'?'triangle':'sine';osc.frequency.setValueAtTime(freq,now+i*.065);gain.gain.setValueAtTime(0,now+i*.065);gain.gain.linearRampToValueAtTime(.035,now+i*.065+.008);gain.gain.exponentialRampToValueAtTime(.001,now+i*.065+(kind==='win'?.35:.085));osc.start(now+i*.065);osc.stop(now+i*.065+.4);});}catch{}}

ctionnez de 1 à 4 cartes. Le bluff est permis.'];if(S.id==='pouilleux')return ['À vous de piocher','Choisissez une carte cachée chez votre voisin.'];if(S.id==='rummikub')return ['À vous de composer','Sélectionnez des tuiles, puis choisissez leur destination.'];return ['À vous de jouer',S.phase==='bet'?'Choisissez votre mise en jetons fictifs.':'Tirez, restez ou doublez la mise.'];}

function boardCoordinates(){const coords=[];let left=0,right=8,top=0,bottom=6;while(left<=right&&top<=bottom){for(let x=left;x<=right;x++)coords.push([x,top]);top++;for(let y=top;y<=bottom;y++)coords.push([right,y]);right--;if(top<=bottom){for(let x=right;x>=left;x--)coords.push([x,bottom]);bottom--;}if(left<=right){for(let y=bottom;y>=top;y--)coords.push([left,y]);left++;}}return coords;}

function animatePawn(path,old){

 const end=pawn.getBoundingClientRect(),start=old.get('pawn-'+S.movedPlayer),points=[],cells=[];
 if(start)points.push({x:start.left-end.left,y:start.top-end.top});

 points.push({x:0,y:0});if(points.length<2)return;
 const delay=immersive()?motionDuration(740):0,duration=motionDuration(Math.min(1450,Math.max(430,points.length*75))),frames=[];
 points.forEach((p,i)=>{if(i){const a=points[i-1];frames.push({transform:`translate3d(${(a.x+p.x)/2}px,${(a.y+p.y)/2-5}px,0)`,offset:(i-.5)/(points.length-1)});}frames.push({transform:`translate3d(${p.x}px,${p.y}px,0)`,offset:i/(points.length-1)});});

}

/* Annuaire entre navigateurs : aucune route /api ni base de données requise.
   Un navigateur occupe le rendez-vous PeerJS ; les autres prennent le relais
   à sa fermeture. Seul le propriétaire du Peer d'un salon peut le publier. */
const DIRECTORY_ID='latabledesjeux-v16-public-lobby-20260921-v16',DIRECTORY_VERSION=1;
const directory={enabled:false,stopped:false,rooms:[],status:'idle',error:'',conn:null,source:null,reader:null,leader:null,candidate:null,records:new Map(),clients:new Set(),retry:null,deadline:null,publishTimer:null,lastQuery:0,lastPublish:0,lastSignature:'',published:'',lastReply:0};
function directoryWanted(){return !directory.stopped&&(directory.enabled||net.active&&net.role==='host'&&net.publicRoom);}
function validPublicRoom(r){return !!r&&typeof r.code==='string'&&validRoom(r.code)&&Object.hasOwn(GAMES,r.gameId)&&typeof r.name==='string'&&r.name.length<=24&&Number.isInteger(r.capacity)&&r.capacity>=2&&r.capacity<=GAMES[r.gameId].max&&Number.isInteger(r.players)&&r.players>=1&&r.players<=r.capacity&&typeof r.started==='boolean'&&typeof r.joinable==='boolean'&&(!r.joinable||r.players<r.capacity)&&Number.isInteger(r.spectators)&&r.spectators>=0&&r.spectators<=12;}
function publicRoomSnapshot(){if(!net.active||net.role!=='host'||!net.publicRoom||!net.signalOpen||!net.peer?.open)return null;return {code:net.code,gameId:net.gameId,name:networkName(net.name),players:mpOccupied(),capacity:net.capacity,started:!!net.started,joinable:mpAvailable()>=0,spectators:net.spectators?.size||0};}
function directorySend(conn,data){if(!conn?.open)return false;try{conn.send({v:DIRECTORY_VERSION,...data});return true;}catch{return false;}}
function directoryPrune(){for(const [owner,entry] of directory.records)if(Date.now()-entry.updated>120000||entry.conn&&!entry.conn.open)directory.records.delete(owner);}
function directoryReceiveRooms(rooms,published=''){directory.rooms=rooms.filter(validPublicRoom).slice(0,200);directory.status='ready';directory.error='';directory.published=published;directory.lastReply=Date.now();renderRooms();directoryStatus();}
function directoryBrokerSnapshot(conn){directoryPrune();const published=directory.records.get(conn.peer)?.room.code||'';directorySend(conn,{kind:'rooms',rooms:[...directory.records.values()].map(e=>e.room),published});}
function directoryBrokerBroadcast(){directoryPrune();for(const conn of directory.clients)directoryBrokerSnapshot(conn);directoryReceiveRooms([...directory.records.values()].map(e=>e.room),net.active&&net.role==='host'?directory.records.get(net.peer?.id)?.room.code||'':'');}
function directoryBrokerConnection(conn){
 if(directory.clients.size>=250){conn.close();return;}directory.clients.add(conn);let last=0;
 conn.on('open',()=>directoryBrokerSnapshot(conn));
 conn.on('data',data=>{
  if(!data||data.v!==DIRECTORY_VERSION||Date.now()-last<75)return;
  try{if(JSON.stringify(data).length>2048)return;}catch{return;}last=Date.now();
  if(data.kind==='publish'){
   const room=data.room;if(!validPublicRoom(room)||conn.peer!==ROOM_PREFIX+room.code)return;
   if(directory.records.size>=200&&!directory.records.has(conn.peer))return;
   directory.records.set(conn.peer,{room:{code:room.code,gameId:room.gameId,name:networkName(room.name),players:room.players,capacity:room.capacity,started:room.started,joinable:room.joinable,spectators:room.spectators},conn,updated:Date.now()});directoryBrokerBroadcast();
  }else if(data.kind==='remove'){if(directory.records.get(conn.peer)?.conn===conn)directory.records.delete(conn.peer);directoryBrokerBroadcast();}
  else if(data.kind==='list')directoryBrokerSnapshot(conn);

 const remove=()=>{directory.clients.delete(conn);if(directory.records.get(conn.peer)?.conn===conn)directory.records.delete(conn.peer);directoryBrokerBroadcast();};
 conn.on('close',remove);conn.on('error',()=>{remove();try{conn.close();}catch{}});
}
function directoryRetry(delay=1600){if(!directoryWanted())return;clearTimeout(directory.retry);directory.retry=setTimeout(()=>{directory.retry=null;directoryEnsure();},delay);}
function directoryDropConnection(){clearTimeout(directory.deadline);const conn=directory.conn;directory.conn=null;directory.source=null;directory.lastSignature='';directory.published='';if(conn)try{conn.close();}catch{}}
function directoryElect(){
 if(!directoryWanted()||directory.leader?.open||directory.candidate)return;
 directoryDropConnection();directory.status='connecting';renderRooms();
 let peer;try{peer=new Peer(DIRECTORY_ID,{secure:true,debug:0});directory.candidate=peer;}catch{directoryFail();return;}
 const deadline=setTimeout(()=>{if(directory.candidate===peer){directory.candidate=null;peer.destroy();directoryFail();}},12000);
 peer.on('open',()=>{clearTimeout(deadline);if(directory.stopped||directory.candidate!==peer){peer.destroy();return;}directory.candidate=null;directory.leader=peer;directory.records.clear();directoryEnsure();});
 peer.on('connection',conn=>{if(directory.leader===peer)directoryBrokerConnection(conn);else conn.close();});
 peer.on('error',error=>{clearTimeout(deadline);if(directory.candidate===peer)directory.candidate=null;if(directory.leader===peer){directory.leader=null;directory.clients.clear();directory.records.clear();}try{peer.destroy();}catch{}if(error.type==='unavailable-id'){directoryRetry(600+Math.random()*700);}else directoryFail();});

function directoryFail(){directory.status='error';directory.error=navigator.onLine===false?'Vous êtes hors connexion. Les salons reviendront avec Internet.':'La liaison avec les salons est momentanément indisponible. Nouvelle tentative automatique…';directory.published='';renderRooms();directoryStatus();directoryRetry(6000);}

function directoryReader(){
 if(directory.reader&&!directory.reader.destroyed){if(directory.reader.disconnected)try{directory.reader.reconnect();}catch{}return directory.reader;}
 const peer=new Peer(ROOM_PREFIX+'browse-'+randomToken(),{secure:true,debug:0});directory.reader=peer;
 peer.on('open',()=>{if(directory.reader===peer)directoryEnsure();});
 peer.on('error',error=>{if(directoryPeerError(peer,error))return;if(directory.reader===peer){directoryDropConnection();directoryFail();}});

 peer.on('close',()=>{if(directory.reader===peer){directory.reader=null;directoryRetry();}});return peer;

function directoryExchange(){
 const room=publicRoomSnapshot();
 if(directory.leader?.open){
  if(room){directory.records.set(net.peer.id,{room,conn:null,updated:Date.now()});directoryBrokerBroadcast();}
  else directoryReceiveRooms([...directory.records.values()].filter(e=>Date.now()-e.updated<120000).map(e=>e.room));
  directoryStatus();return;

 const conn=directory.conn;if(!conn?.open)return;

 else if(now-directory.lastQuery>1500){directory.lastQuery=now;directorySend(conn,{kind:'list'});}
}
function directoryEnsure(){
 if(!directoryWanted())return;
 if(typeof Peer!=='function'||typeof RTCPeerConnection==='undefined'){directory.status='error';directory.error='Ce navigateur ne prend pas en charge la connexion entre joueurs.';renderRooms();return;}
 if(directory.leader?.open){directoryExchange();return;}
 if(directory.candidate)return;
 let source;try{source=net.active&&net.role==='host'&&net.publicRoom?net.peer:directoryReader();}catch{directoryFail();return;}
 if(!source?.open){directory.status='connecting';renderRooms();directoryRetry();return;}
 if(directory.source===source&&directory.conn){if(directory.conn.open)directoryExchange();return;}
 directoryDropConnection();directory.source=source;directory.status='connecting';renderRooms();
 let conn;try{conn=source.connect(DIRECTORY_ID,{reliable:true,serialization:'json',label:'table-public-directory'});directory.conn=conn;}catch{directoryFail();return;}

 conn.on('open',()=>{if(directory.conn!==conn){conn.close();return;}clearTimeout(directory.deadline);directory.lastQuery=0;directory.lastPublish=0;directoryExchange();});
 conn.on('data',data=>{if(directory.conn!==conn||!data||data.v!==DIRECTORY_VERSION||data.kind!=='rooms'||!Array.isArray(data.rooms)||data.rooms.length>200)return;try{if(JSON.stringify(data).length>65000)return;}catch{return;}directoryReceiveRooms(data.rooms,typeof data.published==='string'?data.published:'');});

}
function directoryRefresh(){directory.enabled=true;directoryEnsure();}
function directoryPublish(){if(!net.active||net.role!=='host'||!net.publicRoom)return;clearTimeout(directory.publishTimer);directory.publishTimer=setTimeout(()=>directoryEnsure(),180);}

function cityDebt(s,amount,creditor=-1,reason='Paiement',after='end'){if(amount<=0){s.phase=after;return;}s.debt={amount,creditor,reason,after};if(player(s).cash>=amount)cityPay(s);else{s.phase='debt';say(s,player(s).name+' doit '+amount+' crédits : vendez, hypothéquez ou déclarez faillite.');}}
function cityPay(s){const d=s.debt,p=player(s);if(!d||p.cash<d.amount)return false;p.cash-=d.amount;if(d.creditor>=0)s.players[d.creditor].cash+=d.amount;s.phase=d.after;s.debt=null;say(s,p.name+' règle '+d.amount+' crédits · '+d.reason+'.');return true;}
function cityJail(s){const p=player(s);p.pos=6;p.jailed=1;s.phase='end';say(s,p.name+' est placé en détention.');}
function cityLand(s){const p=player(s),k=p.pos,c=CITY_BOARD[k];s.phase='end';
 if(c.type==='property'){if(s.owners[k]<0){s.offer=k;s.phase='buy';say(s,p.name+' peut acheter '+c.name+' pour '+c.price+' crédits.');}else if(s.owners[k]!==s.turn)cityDebt(s,cityRent(s,k),s.owners[k],'loyer de '+c.name);else say(s,p.name+' arrive sur sa rue '+c.name+'.');}
 else if(c.type==='tax')cityDebt(s,k===4?100:70,-1,c.name);
 else if(c.type==='gojail')cityJail(s);
 else if(c.type==='chance'){if(!s.events.length)s.events=shuffle(CITY_EVENTS.map((_,i)=>i));const e=CITY_EVENTS[s.events.pop()];s.lastEvent=e.text;say(s,e.text);if(e.jail)cityJail(s);else if(e.start){p.pos=0;p.cash+=150;}else if(e.repairs)cityDebt(s,s.houses.reduce((n,h,i)=>n+(s.owners[i]===s.turn?h*20:0),0),-1,'travaux');else if(e.amount<0)cityDebt(s,-e.amount,-1,'événement');else p.cash+=e.amount;}
 else say(s,p.name+' arrive : '+c.name+'.');}
function playCity(s,a){const p=player(s);if(p.out)return false;const k=a.index,c=CITY_BOARD[k];
 if(['mortgage','redeem','build','sellHouse'].includes(a.type)){if(!Number.isInteger(k)||!c||c.type!=='property'||s.owners[k]!==s.turn||!['roll','buy','end','debt'].includes(s.phase))return false;const group=cityGroup(s,c.group);
  if(a.type==='mortgage'){if(s.mortgaged[k]||group.some(i=>s.houses[i]))return false;s.mortgaged[k]=true;p.cash+=Math.floor(c.price/2);}
  if(a.type==='redeem'){const cost=Math.ceil(Math.floor(c.price/2)*1.1);if(!s.mortgaged[k]||p.cash<cost||s.phase==='debt')return false;s.mortgaged[k]=false;p.cash-=cost;}
  if(a.type==='build'){if(s.phase==='debt'||!cityOwnsGroup(s,k,s.turn)||s.houses[k]>=3||p.cash<c.build||s.houses[k]>Math.min(...group.map(i=>s.houses[i])))return false;p.cash-=c.build;s.houses[k]++;}
  if(a.type==='sellHouse'){if(s.houses[k]===0||s.houses[k]<Math.max(...group.map(i=>s.houses[i])))return false;s.houses[k]--;p.cash+=Math.floor(c.build/2);}
  say(s,p.name+' : '+({mortgage:'hypothèque',redeem:'levée d’hypothèque',build:'construction',sellHouse:'vente de maison'}[a.type])+' · '+c.name+'.');s.moves++;return true;
 }
 if(a.type==='pay'&&s.phase==='debt')return cityPay(s);
 if(a.type==='bankrupt'&&s.phase==='debt'){if(p.cash>=s.debt.amount)return false;if(s.debt.creditor>=0)s.players[s.debt.creditor].cash+=p.cash;p.cash=0;p.out=true;for(let i=0;i<24;i++)if(s.owners[i]===s.turn){s.owners[i]=-1;s.houses[i]=0;s.mortgaged[i]=false;}say(s,p.name+' déclare faillite.');cityEndTurn(s);return true;}
 if(a.type==='bail'&&s.phase==='roll'&&p.jailed&&p.cash>=50){p.cash-=50;p.jailed=0;say(s,p.name+' règle sa caution.');return true;}
 if(a.type==='roll'&&s.phase==='roll'){s.dice=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];s.moves++;const total=s.dice[0]+s.dice[1];
  if(p.jailed){if(s.dice[0]===s.dice[1])p.jailed=0;else if(p.jailed<3){p.jailed++;s.phase='end';say(s,p.name+' reste en détention.');return true;}else{p.jailed=0;s.jailMove=total;cityDebt(s,50,-1,'sortie de détention','jailMove');if(s.phase==='jailMove'){cityMove(s,total);}return true;}}
  cityMove(s,total);return true;
 }
 if(a.type==='continue'&&s.phase==='jailMove'){cityMove(s,s.jailMove);return true;}
 if(a.type==='buy'&&s.phase==='buy'){const offer=CITY_BOARD[s.offer];if(s.owners[s.offer]>=0||p.cash<offer.price)return false;p.cash-=offer.price;s.owners[s.offer]=s.turn;say(s,p.name+' achète '+offer.name+'.');s.offer=null;s.phase='end';return true;}
 if(a.type==='decline'&&s.phase==='buy'){s.offer=null;s.phase='end';return true;}
 if(a.type==='endTurn'&&s.phase==='end'){cityEndTurn(s);return true;}return false;}
function cityMove(s,total){const p=player(s);if(p.pos+total>=24)p.cash+=150;p.pos=(p.pos+total)%24;cityLand(s);}
function cityAI(s){const p=player(s);if(s.phase==='debt'){if(p.cash>=s.debt.amount)return {type:'pay'};const house=s.houses.findIndex((h,i)=>h>0&&s.owners[i]===s.turn&&h===Math.max(...cityGroup(s,CITY_BOARD[i].group).map(k=>s.houses[k])));if(house>=0)return {type:'sellHouse',index:house};const property=s.owners.findIndex((o,i)=>o===s.turn&&!s.mortgaged[i]&&cityGroup(s,CITY_BOARD[i].group).every(k=>!s.houses[k]));return property>=0?{type:'mortgage',index:property}:{type:'bankrupt'};}
 if(s.phase==='buy')return {type:p.cash>=CITY_BOARD[s.offer].price+100?'buy':'decline'};if(s.phase==='jailMove')return {type:'continue'};if(s.phase==='roll')return {type:'roll'};
 const k=s.owners.findIndex((o,i)=>o===s.turn&&cityOwnsGroup(s,i,s.turn)&&s.houses[i]<3&&s.houses[i]===Math.min(...cityGroup(s,CITY_BOARD[i].group).map(j=>s.houses[j]))&&p.cash>CITY_BOARD[i].build+300);return k>=0?{type:'build',index:k}:{type:'endTurn'};}
function playBattle(s,a){if(a.type!=='battle')return false;let contenders=active(s),pot=[],reveals=[];s.battleNumber++;s.moves++;let tied=false,winner=-1;
 for(let round=0;round<52;round++){const faces=[];for(const i of contenders){const h=s.players[i].hand;if(tied&&h.length>1){pot.push(h.shift());reveals.push({owner:i,hidden:true});}if(h.length){const card=h.shift();pot.push(card);reveals.push({owner:i,card});faces.push({i,rank:card.rank===1?14:card.rank});}}
  if(!faces.length){const split=shuffle(pot);for(let j=0;j<split.length;j++)s.players[contenders[j%contenders.length]].hand.push(split[j]);pot=[];break;}
  const top=Math.max(...faces.map(f=>f.rank));contenders=faces.filter(f=>f.rank===top).map(f=>f.i);if(contenders.length===1){winner=contenders[0];break;}tied=true;
 }
 s.battlePot=pot.length;s.battleReveal=reveals;s.battleWinner=winner;if(winner>=0)s.players[winner].hand.push(...shuffle(pot));say(s,winner>=0?s.players[winner].name+' remporte '+pot.length+' cartes'+(tied?' après bataille !':'.'):'Égalité sans réserve : les cartes sont partagées.');const live=active(s);if(live.length<=1||s.battleNumber>=200){s.totals=s.players.map(p=>p.hand.length);const best=Math.max(...s.totals);finish(s,live.filter(i=>s.totals[i]===best),live.length===1?'Toutes les cartes sont réunies !':'200 plis : le plus grand paquet gagne.');}else s.turn=next(s,s.turn,i=>s.players[i].hand.length>0);return true;}
act=function(s,a){if(s.phase==='over')return false;if(s.id==='metropole')return playCity(s,a);if(s.id==='bataille')return playBattle(s,a);return legacyAct(s,a);};
ai=function(s){return s.id==='metropole'?cityAI(s):s.id==='bataille'?{type:'battle'}:legacyAI(s);};
projectGame=function(source,viewer){const v=legacyProjectGame(source,viewer);if(source.id==='metropole')delete v.events;if(source.id==='bataille')v.players.forEach((p,i)=>p.hand=hiddenCards(source.players[i].hand,'battle-'+i));return v;};
sanitizeOnlineAction=function(id,raw){if(['metropole','bataille'].includes(id)){if(!raw||typeof raw!=='object')return null;const allowed=id==='bataille'?['battle']:['roll','buy','decline','endTurn','mortgage','redeem','build','sellHouse','pay','bankrupt','bail','continue'];if(!allowed.includes(raw.type))return null;const a={type:raw.type};if(['mortgage','redeem','build','sellHouse'].includes(a.type)){if(!Number.isInteger(raw.index)||raw.index<0||raw.index>23)return null;a.index=raw.index;}return a;}return legacySanitizeAction(id,raw);};

actionsHTML=function(){if(!S||!['metropole','bataille'].includes(S.id))return legacyActionsHTML();if(!canPlay())return `<p class="action-note">${esc(isOnline()?onlineWaitingText():player(S).bot?'La table joue…':'Attendez votre tour.')}</p>`;if(S.id==='bataille')return `<div class="action-zone">${button('Retourner le pli · '+(S.battleNumber+1)+' / 200','battle')}</div>`;let html='';if(S.phase==='roll')html=button('Lancer les dés','roll')+(player(S).jailed?button('Payer la caution · 50','bail',{},player(S).cash<50,'secondary'):'');if(S.phase==='buy')html=button('Acheter · '+CITY_BOARD[S.offer].price,'buy',{},player(S).cash<CITY_BOARD[S.offer].price)+button('Laisser à la banque','decline',{},false,'secondary');if(S.phase==='end')html=button('Terminer le tour →','endTurn');if(S.phase==='jailMove')html=button('Avancer','continue');if(S.phase==='debt')html=button('Régler · '+S.debt.amount,'pay',{},player(S).cash<S.debt.amount)+`<button class="btn danger" data-action="city-bankrupt">Déclarer faillite</button>`;return `<div class="action-zone city-actions">${html}</div>`;};
function cityBoardHTML(){const s=S,p=player(s);return `<section class="city-game" aria-label="Plateau de Métropole"><div class="city-top"><span>TOUR DE TABLE ${s.lap} / 20</span><div class="city-dice">${s.dice.map(d=>dieHTML(d)).join('')}</div><span>${esc(p.name)} · ${p.cash} crédits</span></div><div class="city-board">${CITY_BOARD.map((c,i)=>{const owner=s.owners[i],tokens=s.players.map((p,j)=>!p.out&&p.pos===i?`<span class="city-token" title="${esc(p.name)}" style="background:${COLORS[j%COLORS.length]}">${j+1}</span>`:'').join('');return `<button type="button" class="city-cell ${i===p.pos?'current':''} ${s.mortgaged[i]?'mortgaged':''}" data-action="city-inspect" data-index="${i}" style="--street:${c.type==='property'?CITY_COLORS[c.group]:'#637363'}" aria-label="Case ${i}, ${esc(c.name)}${owner>=0?', propriété de '+esc(s.players[owner].name):''}"><span class="city-strip">${s.houses[i]?'⌂'.repeat(s.houses[i]):' '}</span><strong>${esc(c.name)}</strong><small>${c.type==='property'?(s.mortgaged[i]?'Hypothéquée':owner<0?c.price+' ¤':'Loyer '+cityRent(s,i)+' ¤'):{start:'+150 ¤',tax:i===4?'−100 ¤':'−70 ¤',chance:'✦',jail:'▥',park:'☕',gojail:'→ ▥'}[c.type]}</small><span class="city-tokens">${tokens}</span>${owner>=0?`<span class="city-owner" style="background:${COLORS[owner%COLORS.length]}" aria-label="Joueur ${owner+1}">${owner+1}</span>`:''}</button>`;}).join('')}</div>${s.debt?`<p class="city-debt" role="status">${esc(s.debt.reason)} · ${s.debt.amount} crédits dus · il manque ${Math.max(0,s.debt.amount-p.cash)} crédits.</p>`:''}<p class="hand-help">Touchez une rue pour gérer vos biens ou proposer un rachat à son propriétaire. Les chiffres identifient les joueurs.</p>${cityPortfolioHTML()}</section>`;}
function cityPortfolioHTML(){const owner=isOnline()?net.me:S.mode==='solo'?0:S.turn;if(owner>=S.players.length)return '';const streets=S.owners.map((o,i)=>o===owner?i:-1).filter(i=>i>=0);return `<div class="city-portfolio"><strong>Vos propriétés · ${streets.length}</strong>${streets.length?streets.map(i=>`<button class="btn small secondary" data-action="city-inspect" data-index="${i}">${esc(CITY_BOARD[i].name)} ${S.houses[i]?'· '+S.houses[i]+' ⌂':''}</button>`).join(''):'<span>Achetez votre première rue en arrivant dessus.</span>'}</div>`;}
function cityInspect(index){if(!S||S.id!=='metropole')return;const c=CITY_BOARD[index],owner=S.owners[index],mine=canPlay()&&owner===S.turn&&S.phase!=='tradeResponse',group=c.type==='property'?cityGroup(S,c.group):[],max=group.length?Math.max(...group.map(i=>S.houses[i])):0,min=group.length?Math.min(...group.map(i=>S.houses[i])):0;modal(`<div class="eyebrow">MÉTROPOLE · CASE ${index}</div><h2>${esc(c.name)}</h2>${c.type==='property'?`<p class="modal-subtitle">${owner<0?'À la banque':'Propriété de '+esc(S.players[owner].name)} · ${c.price} crédits · ${S.houses[index]} maison(s)</p><p>Loyer de base : ${c.rent} · couleur complète : ${c.rent*2}<br>1 / 2 / 3 maisons : ${[3,5,8].map(n=>n*c.rent).join(' / ')}<br>Construction : ${c.build} par maison.</p>${S.mortgaged[index]?'<p>Hypothéquée : aucun loyer perçu.</p>':''}${mine?`<div class="city-manage">${S.mortgaged[index]?cityControl('Lever l’hypothèque · '+Math.ceil(Math.floor(c.price/2)*1.1),'redeem',index,player(S).cash<Math.ceil(Math.floor(c.price/2)*1.1)||S.phase==='debt'):cityControl('Hypothéquer · +'+Math.floor(c.price/2),'mortgage',index,group.some(i=>S.houses[i]))}${cityControl('Construire · '+c.build,'build',index,S.phase==='debt'||!cityOwnsGroup(S,index,S.turn)||S.houses[index]>=3||S.houses[index]>min||player(S).cash<c.build)}${cityControl('Vendre une maison · +'+Math.floor(c.build/2),'sellHouse',index,!S.houses[index]||S.houses[index]<max)}</div>`:''}`:'<p class="modal-subtitle">'+({start:'Recevez 150 crédits chaque fois que vous passez ici.',tax:'La contribution est réglée à votre arrivée.',chance:'Une carte événement est tirée à votre arrivée.',jail:'Simple visite, sauf si vous êtes envoyé en détention.',park:'Une pause sans gain ni taxe.',gojail:'Direction la détention, sans prime de départ.'}[c.type])+'</p>'}<button class="btn full secondary" data-action="close-modal">Revenir au plateau</button>`,'city');}

normalizeTime=function(id,raw){const t=V12_NORMALIZE(id,raw);if(id==='rummikub')t.drawBonus=Number.isInteger(raw?.drawBonus)&&raw.drawBonus>=0&&raw.drawBonus<=60?raw.drawBonus:10;return t;};

rummiClockHTML=function(){let html=V12_CLOCK_HTML();if(S?.id==='rummikub'&&S.clock)html=html.replaceAll(`<small>+${S.clock.increment/1000} s</small>`,`<small>Pose +${S.clock.increment/1000} s · Pioche +${S.clock.drawIncrement/1000} s</small>`);return html;};

GAMES.rummikub.rules=GAMES.rummikub.rules.map(r=>r.startsWith('Pendule facultative')?r.replace('bonus de 0 à 60 secondes par tour terminé (Rummikub : uniquement une pose validée)','deux gains indépendants de 0 à 60 secondes : une pose validée et une pioche manuelle effective. Les deux valeurs sont réglables séparément, y compris à zéro. Passer lorsque la pioche est vide ne donne aucun gain'):r);

Object.assign(GAMES,{
 suites:{name:'Les quatre suites',short:'Quatre suites',tag:'Quatre familles. Une course à la dernière carte.',desc:'Ouvrez les 7, prolongez les familles et videz votre main.',category:'cartes',kind:'Placement & tactique',time:'5–12 min',min:2,max:8,accent:'#abd9cf',bg:'#31594f',symbol:'7',rules:['Videz votre main avant les autres. Les 52 cartes sont distribuées entre 2 à 8 joueurs ; certaines mains ont une carte de plus.','Le détenteur du 7 de cœur commence en le posant. Ensuite, chacun pose une seule carte par tour.','Ouvrez une famille avec son 7, ou prolongez une famille déjà ouverte par la valeur immédiatement inférieure ou supérieure. Ordre : as, 2, …, valet, dame, roi. Pas de boucle entre roi et as.','Vous ne pouvez passer que si aucune carte de votre main ne peut être posée. Il n’y a pas de pioche. La première main vide gagne.','Sélectionnez une carte, puis confirmez avec « Poser ». Les familles affichent toutes les valeurs déjà jouées. Les mains adverses restent secrètes.']},

const V12_CREATE=createGame,V12_ACT=act,V12_AI=ai,V12_SANITIZE=sanitizeOnlineAction;
createGame=function(id,config,old=null){if(!NEW_CARD_GAMES.includes(id))return V12_CREATE(id,config,old);const s=basic({version:5,id,mode:config.mode,round:old?old.round+1:1,config:clone(config),players:config.names.map((name,i)=>({name:networkName(name),bot:config.mode==='solo'&&i>0,hand:[],score:0})),deck:[],discard:[]});
 if(id==='suites'){const cards=deck();s.lanes=Object.fromEntries(SUITS.map(suit=>[suit,[]]));let i=0;while(cards.length)s.players[i++%s.players.length].hand.push(cards.pop());s.turn=s.players.findIndex(p=>p.hand.some(c=>c.rank===7&&c.suit==='H'));s.opening=true;s.lastCard=null;say(s,'Le 7 de cœur ouvre la table.');}
 else{s.dealNumber=1;s.completedTricks=0;s.trickCards=[];s.lastTrick=[];dealTricks(s);}return s;};
function dealTricks(s){s.deck=deck();s.discard=[];s.players.forEach(p=>p.hand=s.deck.splice(-6));s.trump=SUITS[(s.dealNumber-1)%4];s.turn=(s.dealNumber-1)%s.players.length;s.trickCards=[];s.lastTrick=[];s.phase='play';s.completedTricks=0;say(s,'Manche '+s.dealNumber+' / 3 · atout '+SUIT_NAMES[s.trump]+'.');}
function suitesLegal(s,c){if(!c||c.hidden)return false;if(s.opening)return c.rank===7&&c.suit==='H';const lane=s.lanes[c.suit];return lane.length?c.rank===lane[0].rank-1||c.rank===lane.at(-1).rank+1:c.rank===7;}
function tricksLegal(s,c){if(!c||c.hidden||s.phase!=='play')return false;const lead=s.trickCards[0]?.card.suit;return !lead||c.suit===lead||!player(s).hand.some(x=>x.suit===lead);}
function tricksWinner(s,entries=s.trickCards){const lead=entries[0].card.suit;const value=c=>(c.suit===s.trump?100:c.suit===lead?50:0)+(c.rank===1?14:c.rank);return entries.reduce((best,e)=>value(e.card)>value(best.card)?e:best).owner;}
function playNewCards(s,a){if(s.phase==='over'||!a)return false;const p=player(s),actor=s.turn;
 if(s.id==='plis'&&a.type==='collect'&&s.phase==='trickResult'){s.lastTrick=clone(s.trickCards);s.discard.push(...s.trickCards.map(e=>e.card));s.trickCards=[];s.moves++;if(s.completedTricks===6){s.dealNumber++;dealTricks(s);}else s.phase='play';return true;}
 if(s.phase!=='play')return false;
 if(s.id==='suites'&&a.type==='pass'){if(p.hand.some(c=>suitesLegal(s,c)))return false;s.moves++;say(s,p.name+' passe.');s.turn=next(s);return true;}
 if(a.type!=='card'||typeof a.id!=='string')return false;const k=p.hand.findIndex(c=>c.id===a.id),c=p.hand[k];if(k<0||!(s.id==='suites'?suitesLegal(s,c):tricksLegal(s,c)))return false;
 p.hand.splice(k,1);s.moves++;
 if(s.id==='suites'){s.lanes[c.suit].push(c);s.lanes[c.suit].sort((a,b)=>a.rank-b.rank);s.opening=false;s.lastCard={...c,owner:actor};say(s,p.name+' pose '+cardLabel(c)+'.');if(!p.hand.length){s.totals=s.players.map(p=>p.hand.length);finish(s,actor,p.name+' a posé toute sa main !');}else s.turn=next(s);}
 else{s.trickCards.push({owner:actor,card:c});say(s,p.name+' joue '+cardLabel(c)+'.');if(s.trickCards.length===s.players.length){const winner=tricksWinner(s);s.players[winner].score++;s.completedTricks++;s.turn=winner;s.phase='trickResult';say(s,s.players[winner].name+' remporte le pli !');if(s.completedTricks===6&&s.dealNumber===3){s.totals=s.players.map(p=>p.score);const best=Math.max(...s.totals);finish(s,s.totals.map((n,i)=>n===best?i:-1).filter(i=>i>=0),'Trois manches terminées · '+best+' plis pour la victoire !');}}else s.turn=next(s);}return true;}
act=function(s,a){return NEW_CARD_GAMES.includes(s.id)?playNewCards(s,a):V12_ACT(s,a);};
ai=function(s){if(!NEW_CARD_GAMES.includes(s.id))return V12_AI(s);if(s.phase==='trickResult')return {type:'collect'};const legal=player(s).hand.filter(c=>s.id==='suites'?suitesLegal(s,c):tricksLegal(s,c));if(!legal.length)return {type:'pass'};
 if(s.id==='suites'){legal.sort((a,b)=>{const weight=c=>player(s).hand.filter(x=>x.suit===c.suit&&(c.rank<7?x.rank<c.rank:c.rank>7?x.rank>c.rank:true)).length;return weight(b)-weight(a);});return {type:'card',id:legal[0].id};}
 const weight=c=>(c.suit===s.trump?30:0)+(c.rank===1?14:c.rank);legal.sort((a,b)=>weight(a)-weight(b));const winning=s.trickCards.length?legal.filter(c=>tricksWinner(s,[...s.trickCards,{owner:s.turn,card:c}])===s.turn):[];return {type:'card',id:(winning[0]||legal[0]).id};};
sanitizeOnlineAction=function(id,raw){if(!NEW_CARD_GAMES.includes(id))return V12_SANITIZE(id,raw);if(!raw||typeof raw!=='object')return null;if(raw.type==='card'&&typeof raw.id==='string'&&raw.id.length>0&&raw.id.length<64)return {type:'card',id:raw.id};if(raw.type===(id==='suites'?'pass':'collect'))return {type:raw.type};return null;};

 quatrevingtdixneuf:{name:'Le 99',short:'Le 99',tag:'Le bon calcul, au bord de la limite.',desc:'Posez vos cartes spéciales et gardez le total sous contrôle.',category:'cartes',kind:'Calcul & tactique',time:'4–8 min',min:2,max:8,accent:'#edb1a2',bg:'#724839',symbol:'99',rules:['Variante courte à pioche finie. Chacun reçoit 3 cartes ; le total commun commence à 0. À votre tour, posez une carte sans dépasser 99, puis piochez une carte si le paquet en contient encore.','De 2 à 8 : ajoutez la valeur, sauf le 4 qui inverse le sens sans changer le total. Le 9 ne change pas le total. Le 10 retire 10, sans descendre sous zéro. Valet et dame ajoutent 10. Le roi fixe le total à 99. L’as ajoute 1 ou 11, à votre choix.','Vous devez jouer si vous avez un coup légal. Si toutes vos cartes dépassent 99, le bouton « Je suis bloqué » vous élimine ; les autres continuent. Une élimination ne remet pas le compteur à zéro.','La pioche ne se reconstitue pas. Une fois vide, posez vos dernières cartes sans en reprendre : la première main vide gagne. Le dernier joueur non éliminé gagne aussi.','Sélectionnez une carte puis confirmez son effet. Les cartes adverses et la pioche restent secrètes ; le sens, le total et les effets sont visibles de tous.']},

const V13_CREATE=createGame,V13_ACT=act,V13_AI=ai,V13_SANITIZE=sanitizeOnlineAction;
createGame=function(id,config,old=null){if(!V13_IDS.includes(id))return V13_CREATE(id,config,old);const s=basic({version:5,id,mode:config.mode,round:old?old.round+1:1,config:clone(config),players:config.names.map((name,i)=>({name:networkName(name),bot:config.mode==='solo'&&i>0,hand:[],score:0})),deck:[],discard:[]});
 if(id==='quatrevingtdixneuf'){s.deck=deck();s.total99=0;s.dir=1;s.lastEffect='Le compteur est à zéro.';s.players.forEach(p=>{p.hand=s.deck.splice(-3);p.out=false;});}
 else{s.players.forEach(p=>p.yamSheet=Object.fromEntries(YAM_CATEGORIES.map(c=>[c.id,null])));s.dice=[1,1,1,1,1];s.held=Array(5).fill(false);s.rolls=0;s.yamTurn=1;s.lastScore=null;}

function totalAfter99(s,c,ace=1){if(!c||c.hidden)return Infinity;switch(c.rank){case 1:return [1,11].includes(ace)?s.total99+ace:Infinity;case 4:case 9:return s.total99;case 10:return Math.max(0,s.total99-10);case 13:return 99;case 11:case 12:return s.total99+10;default:return s.total99+c.rank;}}
function legal99(s,c,ace=1){return totalAfter99(s,c,ace)<=99;}
function play99(s,a){if(s.phase!=='play'||player(s).out)return false;const p=player(s),actor=s.turn;
 if(a.type==='bust'){if(p.hand.some(c=>legal99(s,c)))return false;p.out=true;s.moves++;s.lastEffect=p.name+' est bloqué et quitte la manche.';say(s,s.lastEffect);}
 else if(a.type==='card'){const k=p.hand.findIndex(c=>c.id===a.id),c=p.hand[k];if(k<0||!legal99(s,c,a.ace??1))return false;const before=s.total99;p.hand.splice(k,1);s.total99=totalAfter99(s,c,a.ace??1);s.discard.push(c);if(c.rank===4)s.dir*=-1;if(s.deck.length)p.hand.push(s.deck.pop());s.moves++;s.lastEffect=c.rank===4?'Le sens est inversé !':c.rank===13?'Le roi fixe le compteur à 99.':c.rank===9?'Le 9 laisse le compteur inchangé.':(s.total99-before>=0?'+':'')+(s.total99-before)+' · total '+s.total99;say(s,p.name+' : '+cardLabel(c)+' · '+s.lastEffect);if(!p.hand.length){finish(s,actor,p.name+' vide sa main : victoire !');return true;}}
 else return false;
 const live=s.players.map((p,i)=>!p.out?i:-1).filter(i=>i>=0);if(live.length===1)finish(s,live[0],s.players[live[0]].name+' reste seul en jeu !');else s.turn=next(s,actor,i=>!s.players[i].out,s.dir);return true;}
function yamScore(dice,category){if(!Array.isArray(dice)||dice.length!==5||dice.some(n=>!Number.isInteger(n)||n<1||n>6))return 0;const counts=Array(7).fill(0);dice.forEach(n=>counts[n]++);const sum=dice.reduce((a,b)=>a+b,0),unique=[...new Set(dice)].sort((a,b)=>a-b).join('');if(category==='chance')return sum;if(category==='brelan')return Math.max(...counts)>=3?sum:0;if(category==='full')return counts.includes(3)&&counts.includes(2)?25:0;if(category==='petite')return ['1234','2345','3456'].some(seq=>unique.includes(seq))?30:0;if(category==='grande')return ['12345','23456'].includes(unique)?40:0;if(category==='yam')return counts.includes(5)?50:0;return 0;}
function playYam(s,a){if(s.phase!=='play')return false;
 if(a.type==='hold'){if(!s.rolls||s.rolls>=3||!Number.isInteger(a.index)||a.index<0||a.index>4)return false;s.held[a.index]=!s.held[a.index];s.moves++;return true;}
 if(a.type==='roll'){if(s.rolls>=3)return false;const keep=a.keep??s.held.map((h,i)=>h?i:-1).filter(i=>i>=0);if(!Array.isArray(keep)||keep.some(i=>!Number.isInteger(i)||i<0||i>4)||new Set(keep).size!==keep.length||keep.length===5||!s.rolls&&keep.length)return false;s.held=Array.from({length:5},(_,i)=>keep.includes(i));s.dice=s.dice.map((d,i)=>s.held[i]?d:1+Math.floor(Math.random()*6));s.rolls++;s.moves++;say(s,player(s).name+' : lancer '+s.rolls+' / 3.');return true;}
 if(a.type==='score'){const category=YAM_CATEGORIES.find(c=>c.id===a.category),p=player(s);if(!s.rolls||!category||p.yamSheet[category.id]!==null)return false;const value=yamScore(s.dice,category.id);p.yamSheet[category.id]=value;p.score+=value;s.lastScore={owner:s.turn,category:category.name,value,dice:[...s.dice]};s.moves++;say(s,p.name+' inscrit '+value+' points en '+category.name+'.');if(s.players.every(p=>Object.values(p.yamSheet).every(n=>n!==null))){s.totals=s.players.map(p=>p.score);const best=Math.max(...s.totals);finish(s,s.totals.map((n,i)=>n===best?i:-1).filter(i=>i>=0),'Six tours terminés · meilleur total : '+best+' points.');}else{s.turn=next(s,s.turn,i=>Object.values(s.players[i].yamSheet).some(n=>n===null));s.yamTurn=1+Object.values(player(s).yamSheet).filter(n=>n!==null).length;s.rolls=0;s.held=Array(5).fill(false);}return true;}
 return false;}
act=function(s,a){if(!V13_IDS.includes(s.id))return V13_ACT(s,a);if(!a||typeof a!=='object'||s.phase==='over')return false;return s.id==='yam'?playYam(s,a):play99(s,a);};
ai=function(s){if(V13_IDS.includes(s.id)&&s.phase==='over')return {type:'noop'};if(s.id==='quatrevingtdixneuf'){const legal=player(s).hand.flatMap(c=>(c.rank===1?[1,11]:[1]).filter(ace=>legal99(s,c,ace)).map(ace=>({c,ace})));if(!legal.length)return {type:'bust'};legal.sort((a,b)=>{const weight=x=>([4,9,10,13].includes(x.c.rank)?-30:0)+totalAfter99(s,x.c,x.ace);return weight(b)-weight(a);});return {type:'card',id:legal[0].c.id,ace:legal[0].ace};}
 if(s.id!=='yam')return V13_AI(s);if(!s.rolls)return {type:'roll'};const sheet=player(s).yamSheet,available=YAM_CATEGORIES.filter(c=>sheet[c.id]===null),best=available.map(c=>({...c,value:yamScore(s.dice,c.id)})).sort((a,b)=>b.value/b.max-a.value/a.max||b.value-a.value)[0];if(s.rolls>=3||best.value>=best.max&&best.id!=='chance')return {type:'score',category:best.id};
 const counts=Array(7).fill(0);s.dice.forEach(n=>counts[n]++);const common=counts.indexOf(Math.max(...counts)),unique=[...new Set(s.dice)];let keep;if(unique.length>=4&&(sheet.petite===null||sheet.grande===null)){const seen=new Set();keep=s.dice.map((n,i)=>{if(seen.has(n))return -1;seen.add(n);return i;}).filter(i=>i>=0);}else keep=s.dice.map((n,i)=>n===common?i:-1).filter(i=>i>=0);if(keep.length===5)return {type:'score',category:best.id};return {type:'roll',keep};};
sanitizeOnlineAction=function(id,raw){if(!V13_IDS.includes(id))return V13_SANITIZE(id,raw);if(!raw||typeof raw!=='object')return null;if(id==='quatrevingtdixneuf'){if(raw.type==='bust')return {type:'bust'};if(raw.type==='card'&&typeof raw.id==='string'&&raw.id.length>0&&raw.id.length<64&&[undefined,1,11].includes(raw.ace))return {type:'card',id:raw.id,ace:raw.ace??1};return null;}
 if(raw.type==='hold'&&Number.isInteger(raw.index)&&raw.index>=0&&raw.index<=4)return {type:'hold',index:raw.index};if(raw.type==='score'&&YAM_CATEGORIES.some(c=>c.id===raw.category))return {type:'score',category:raw.category};if(raw.type==='roll'){if(raw.keep===undefined)return {type:'roll'};if(Array.isArray(raw.keep)&&raw.keep.length<5&&raw.keep.every(i=>Number.isInteger(i)&&i>=0&&i<=4)&&new Set(raw.keep).size===raw.keep.length)return {type:'roll',keep:[...raw.keep]};}return null;};

const V13_BOARD=boardHTML,V13_HAND=handHTML,V13_ACTIONS=actionsHTML,V13_STATUS=playerStatus,V13_TURN=turnText,V13_ART=art,V13_WIN=winHTML,V13_REFRESH=refreshSelection,V13_SCENE=playSceneAction;

/* Collection personnelle : données locales, sans modifier les règles ou le protocole réseau. */
function catalogIDs(value){return Array.isArray(value)?[...new Set(value.filter(id=>typeof id==='string'&&Object.hasOwn(GAMES,id)))].slice(0,Object.keys(GAMES).length):[];}
let catalogFavorites=catalogIDs(storage.get('favorites',[]));
let catalogRecent=catalogIDs(storage.get('recent',[])).slice(0,6);
let catalogOptions={favorites:false,players:0,minutes:0,sort:'collection'};
function catalogClean(value){return String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’']/g,' ').replace(/[^a-z0-9]+/g,' ').trim();}
function catalogDuration(game){return Math.max(...(game.time.match(/\d+/g)||['0']).map(Number));}
function catalogEntries(){
 const words=catalogClean(query).split(' ').filter(Boolean);
 const entries=Object.entries(GAMES).filter(([id,g])=>{
  const text=catalogClean([g.name,g.kind,g.desc,g.category,g.category==='arcade'?'défis arcade réflexion':'',id==='yam'?'yahtzee yams dés':'',id==='rummikub'?'rummi suites tuiles':''].join(' '));
  return (filter==='all'||g.category===filter)&&(!catalogOptions.favorites||catalogFavorites.includes(id))&&(!catalogOptions.players||g.min<=catalogOptions.players&&g.max>=catalogOptions.players)&&(!catalogOptions.minutes||catalogDuration(g)<=catalogOptions.minutes)&&words.every(word=>text.includes(word));
 });
 if(catalogOptions.sort==='name')entries.sort((a,b)=>a[1].name.localeCompare(b[1].name,'fr'));
 if(catalogOptions.sort==='duration')entries.sort((a,b)=>catalogDuration(a[1])-catalogDuration(b[1]));
 if(catalogOptions.sort==='recent')entries.sort((a,b)=>(catalogRecent.includes(a[0])?catalogRecent.indexOf(a[0]):99)-(catalogRecent.includes(b[0])?catalogRecent.indexOf(b[0]):99));
 return entries;
}

/* Préparation des parties : règles sur place et préférences par jeu. */
function normalizeTableChoice(id,raw){
 if(!Object.hasOwn(GAMES,id))return null;
 const g=GAMES[id],mode=['solo','local','online'].includes(raw?.mode)?raw.mode:'solo',min=mode==='solo'?g.min:Math.max(2,g.min);
 const fallback=id==='vingtetun'&&mode==='solo'?1:Math.min(3,g.max);
 return {mode,count:Number.isInteger(raw?.count)?Math.max(min,Math.min(g.max,raw.count)):Math.max(min,fallback)};
}
function cleanTableChoices(raw){return Object.fromEntries(Object.keys(GAMES).filter(id=>raw&&typeof raw==='object'&&Object.hasOwn(raw,id)).map(id=>[id,normalizeTableChoice(id,raw[id])]));}
let tableChoices=cleanTableChoices(storage.get('tableChoices',{})),catalogReturn=null;
function rememberTableChoice(id,mode,count){const choice=normalizeTableChoice(id,{mode,count});if(!choice)return false;if(tableChoices[id]?.mode===choice.mode&&tableChoices[id]?.count===choice.count)return true;tableChoices[id]=choice;return storage.set('tableChoices',tableChoices);}
function preferredTableChoice(id,count=0){const choice=normalizeTableChoice(id,tableChoices[id]);if(!choice)return null;const min=choice.mode==='solo'?GAMES[id].min:Math.max(2,GAMES[id].min);if(Number.isInteger(count)&&count>=min&&count<=GAMES[id].max)choice.count=count;return choice;}

function setupRecapHTML(id,mode,count){const g=GAMES[id];return `<div class="setup-recap" id="setup-recap"><span>${icon('users')} ${mode==='solo'?(count===1?'Vous contre la banque':'Vous + '+(count-1)+' IA'):count+' joueurs · '+(mode==='online'?'chacun son écran':'même écran')}</span><span>${icon('clock')} ${esc(g.time)}</span></div><p class="setup-remember-note">Mode et nombre de joueurs mémorisés pour ce jeu, sur cet appareil.</p>`;}
