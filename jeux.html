openSetup=function(id){
 if(!Object.hasOwn(GAMES,id))return;
 if(view==='home')catalogReturn={id,top:window.scrollY||0,recent:!!document.activeElement?.closest?.('.catalog-recent')};
 const choice=preferredTableChoice(id,view==='home'?catalogOptions.players:0);setup={id,...choice,names:[]};renderSetup();
};
renderSetup=function(){
 V15_SETUP();
 if(setup.mode==='online'&&$('online-capacity'))$('online-capacity').value=String(Math.max(2,Math.min(GAMES[setup.id].max,setup.count)));
 const id=setup.mode==='online'?$('online-game')?.value||setup.id:setup.id,count=setup.mode==='online'?Number($('online-capacity')?.value)||setup.count:setup.count;
 rememberTableChoice(id,setup.mode,count);
 const anchor=setup.mode==='online'?document.querySelector('.online-create-panel'):document.querySelector('#setup-form');
 anchor?.insertAdjacentHTML('afterbegin',setupRecapHTML(id,setup.mode,count)+setupRulesHTML(id));
 if(setup.mode==='local'&&['yam','oie','metropole','bataille','boite'].includes(id)){const note=document.querySelector('#setup-form .mode-note');if(note)note.textContent='À chacun son tour sur le même écran. Les actions et le plateau sont visibles de tous.';}
};
showHome=function(){const returning=view==='game',point=catalogReturn;V15_HOME();if(!returning||!point)return;window.scrollTo({top:point.top,behavior:'instant'});const scope=point.recent?'.catalog-recent ':'.games-grid ';const target=document.querySelector(scope+'[data-action="setup"][data-id="'+point.id+'"]')||$('search-games');target?.focus({preventScroll:true});};
document.addEventListener('change',e=>{
 if(modalKind!=='setup'||!['online-game','online-capacity'].includes(e.target.id))return;
 const id=$('online-game').value;setup.id=id;setup.count=Number($('online-capacity').value);rememberTableChoice(id,'online',setup.count);
 const tab=document.querySelector('[data-action="mode"][data-mode="online"]');if(tab)tab.textContent='En ligne · 2–'+GAMES[id].max;
 const recap=$('setup-recap');if(recap)recap.outerHTML=setupRecapHTML(id,'online',setup.count).replace(/<p class="setup-remember-note">[\s\S]*?<\/p>/,'');
 const rules=$('setup-rules');if(rules&&rules.dataset.game!==id)rules.outerHTML=setupRulesHTML(id);
});

const V16_CREATE=createGame,V16_ACT=act,V16_AI=ai,V16_PROJECT=projectGame,V16_SANITIZE=sanitizeOnlineAction;
createGame=function(id,config,old=null){if(!V16_IDS.includes(id))return V16_CREATE(id,config,old);const s=basic({version:5,id,mode:config.mode,round:old?old.round+1:1,config:clone(config),players:config.names.map(name=>({name:networkName(name),hand:[],score:0,passes:[]})),deck:[],discard:[]});s.players.forEach((p,i)=>p.bot=config.mode==='solo'&&i>0);
 if(id==='encheres'){s.players.forEach((p,i)=>p.hand=Array.from({length:13},(_,k)=>({id:'bid-'+i+'-'+(k+1),rank:k+1,suit:SUITS[i%4]})));s.deck=shuffle(Array.from({length:13},(_,k)=>({id:'prize-'+k,rank:k+1,suit:'D'})));s.bidRound=1;s.carry=0;s.bids=Array(s.players.length).fill(null);s.prize=s.deck.pop();s.pot=s.prize.rank;s.lastAuction=null;s.unclaimed=0;}
 else{s.boxTurns=0;s.boxRound=1;s.boxOwner=0;s.boxNumbers=Array.from({length:9},(_,i)=>i+1);s.boxDice=[];s.boxStage='roll';s.lastBox=null;}
 say(s,GAMES[id].tag);return s;};
function finishAuction(s){const top=Math.max(...s.bids.map(c=>c.rank)),leaders=s.bids.map((c,i)=>c.rank===top?i:-1).filter(i=>i>=0),winner=leaders.length===1?leaders[0]:null;s.lastAuction={round:s.bidRound,pot:s.pot,winner,cards:clone(s.bids)};s.discard.push(...s.bids);s.carry=winner===null?s.pot:0;if(winner!==null)s.players[winner].score+=s.pot;say(s,winner===null?'Égalité à '+top+' : '+s.pot+' points '+(s.bidRound===13?'perdus.':'reportés.') :s.players[winner].name+' remporte '+s.pot+' points avec '+top+'.');s.turn=0;if(s.bidRound===13){s.unclaimed=s.carry;s.totals=s.players.map(p=>p.score);const best=Math.max(...s.totals);finish(s,s.totals.map((n,i)=>n===best?i:-1).filter(i=>i>=0),'Treize enchères terminées · meilleur score : '+best+' points.');}else s.phase='roundEnd';}
function playAuction(s,a){if(s.phase==='roundEnd'&&a.type==='nextRound'){s.bidRound++;s.prize=s.deck.pop();s.pot=s.carry+s.prize.rank;s.bids=Array(s.players.length).fill(null);s.turn=(s.bidRound-1)%s.players.length;s.phase='play';s.moves++;say(s,'Tour '+s.bidRound+' : '+s.pot+' points à remporter.');return true;}if(s.phase!=='play'||a.type!=='bid'||s.bids[s.turn])return false;const p=player(s),index=p.hand.findIndex(c=>c.id===a.id);if(index<0)return false;s.bids[s.turn]=p.hand.splice(index,1)[0];s.moves++;say(s,p.name+' a choisi sa carte, face cachée.');if(s.bids.every(Boolean))finishAuction(s);else s.turn=next(s,s.turn,i=>!s.bids[i]);return true;}
function boxCombinations(numbers,total){const found=[];for(let mask=1;mask<(1<<numbers.length);mask++){let sum=0,values=[];for(let i=0;i<numbers.length;i++)if(mask&(1<<i)){sum+=numbers[i];values.push(numbers[i]);}if(sum===total)found.push(values);}return found;}
function finishBoxPass(s){const score=s.boxNumbers.reduce((a,b)=>a+b,0),owner=s.boxOwner;s.players[owner].score+=score;s.players[owner].passes.push(score);s.lastBox={owner,score,pass:s.boxRound};s.boxTurns++;say(s,s.players[owner].name+(score?' termine avec '+score+' points.':' ferme toute la boîte : zéro point !'));s.turn=0;if(s.boxTurns===s.players.length*3){s.totals=s.players.map(p=>p.score);const best=Math.min(...s.totals);finish(s,s.totals.map((n,i)=>n===best?i:-1).filter(i=>i>=0),'Trois passages chacun · plus petit total : '+best+' points.');}else s.phase='roundEnd';}
function playBox(s,a){if(s.phase==='roundEnd'&&a.type==='nextRound'){s.turn=s.boxOwner=s.boxTurns%s.players.length;s.boxRound=Math.floor(s.boxTurns/s.players.length)+1;s.boxNumbers=Array.from({length:9},(_,i)=>i+1);s.boxDice=[];s.boxStage='roll';s.phase='play';s.moves++;say(s,'Passage '+s.boxRound+' : à '+player(s).name+'.');return true;}if(s.phase!=='play')return false;
 if(a.type==='roll'&&s.boxStage==='roll'){const count=a.count??2;if(![1,2].includes(count)||count===1&&s.boxNumbers.some(n=>n>=7))return false;s.boxDice=Array.from({length:count},()=>1+Math.floor(Math.random()*6));s.moves++;const total=s.boxDice.reduce((a,b)=>a+b,0);s.boxStage='choose';say(s,'Total '+total+' : choisissez les nombres à fermer.');if(!boxCombinations(s.boxNumbers,total).length)finishBoxPass(s);return true;}
 if(a.type!=='close'||s.boxStage!=='choose'||!Array.isArray(a.numbers)||!a.numbers.length||new Set(a.numbers).size!==a.numbers.length||a.numbers.some(n=>!Number.isInteger(n)||!s.boxNumbers.includes(n))||a.numbers.reduce((a,b)=>a+b,0)!==s.boxDice.reduce((a,b)=>a+b,0))return false;s.boxNumbers=s.boxNumbers.filter(n=>!a.numbers.includes(n));s.moves++;say(s,player(s).name+' ferme '+a.numbers.join(' + ')+'.');s.boxStage='roll';if(!s.boxNumbers.length)finishBoxPass(s);return true;
}
act=function(s,a){if(!V16_IDS.includes(s.id))return V16_ACT(s,a);if(!a||typeof a!=='object'||s.phase==='over')return false;return s.id==='encheres'?playAuction(s,a):playBox(s,a);};
ai=function(s){if(!V16_IDS.includes(s.id))return V16_AI(s);if(s.phase==='over')return {type:'noop'};if(s.phase==='roundEnd')return {type:'nextRound'};if(s.id==='encheres'){const cards=player(s).hand,target=Math.min(13,s.pot+(Math.floor(Math.random()*5)-2));const c=[...cards].sort((a,b)=>Math.abs(a.rank-target)-Math.abs(b.rank-target))[0];return {type:'bid',id:c.id};}if(s.boxStage==='roll')return {type:'roll',count:s.boxNumbers.every(n=>n<7)&&s.boxNumbers.reduce((a,b)=>a+b,0)<=6?1:2};const combos=boxCombinations(s.boxNumbers,s.boxDice.reduce((a,b)=>a+b,0));combos.sort((a,b)=>Math.max(...b)-Math.max(...a)||b.length-a.length);return {type:'close',numbers:combos[0]};};
projectGame=function(source,viewer){const v=V16_PROJECT(source,viewer);if(source.id==='encheres'&&source.phase==='play')v.bids=source.bids.map((c,i)=>!c?null:i===viewer?clone(c):{hidden:true,id:'sealed-'+i});return v;};
sanitizeOnlineAction=function(id,raw){if(!V16_IDS.includes(id))return V16_SANITIZE(id,raw);if(!raw||typeof raw!=='object')return null;if(raw.type==='nextRound')return {type:'nextRound'};if(id==='encheres')return raw.type==='bid'&&typeof raw.id==='string'&&raw.id.length>0&&raw.id.length<64?{type:'bid',id:raw.id}:null;if(raw.type==='roll'&&[undefined,1,2].includes(raw.count))return {type:'roll',count:raw.count??2};if(raw.type==='close'&&Array.isArray(raw.numbers)&&raw.numbers.length>0&&raw.numbers.length<=9&&new Set(raw.numbers).size===raw.numbers.length&&raw.numbers.every(n=>Number.isInteger(n)&&n>=1&&n<=9))return {type:'close',numbers:[...raw.numbers]};return null;};
const V16_ART=art,V16_BOARD=boardHTML,V16_HAND=handHTML,V16_ACTIONS=actionsHTML,V16_STATUS=playerStatus,V16_TURN=turnText,V16_WIN=winHTML,V16_REFRESH=refreshSelection,V16_SCENE=playSceneAction;
art=function(id){if(id==='encheres')return '<div class="auction-art">'+fan([{rank:13,suit:'S'},null,{rank:7,suit:'D'}])+'<b>?</b></div>';if(id==='boite')return '<div class="box-art"><span>1</span><span>4</span><span>9</span>'+dieHTML(5)+'</div>';return V16_ART(id);};
playerStatus=function(i){if(!V16_IDS.includes(S?.id))return V16_STATUS(i);const p=S.players[i];return p.score+' pts · '+(S.id==='boite'?p.passes.length+'/3 passages':S.phase==='play'&&S.bids[i]?'Carte choisie ✓':p.hand.length+' cartes');};
turnText=function(){if(!V16_IDS.includes(S?.id))return V16_TURN();if(S.phase==='roundEnd')return [S.id==='encheres'?'Les cartes sont révélées':'Passage terminé',S.message];if(!canPlay())return V16_TURN();return ['À vous, '+player(S).name,S.id==='encheres'?'Choisissez votre carte puis confirmez l’enchère secrète.':S.boxStage==='roll'?'Lancez les dés pour fermer des nombres.':'Sélectionnez des nombres dont la somme correspond au lancer.'];};
function auctionCardHTML(c,owner){return `<div class="auction-number ${c&&!c.hidden?'':'sealed'}" role="img" aria-label="${c&&!c.hidden?'Carte '+c.rank:'Carte face cachée'}" data-motion-key="bid-${S.bidRound}-${owner}">${c&&!c.hidden?c.rank:'✦'}</div>`;}
boardHTML=function(){if(!V16_IDS.includes(S?.id))return V16_BOARD();if(S.id==='encheres'){const revealed=S.phase!=='play';return `<section class="felt auction-table" aria-label="Table des enchères"><div class="auction-top"><span>Tour ${S.bidRound} / 13</span><span>${S.bids.filter(Boolean).length} / ${S.players.length} cartes choisies</span></div><div class="auction-prize"><span>À REMPORTER</span><strong>${S.pot}</strong><span>points${S.pot>S.prize.rank?' · dont '+(S.pot-S.prize.rank)+' reportés':''}</span></div><div class="auction-bids">${S.players.map((p,i)=>`<div class="auction-seat ${revealed&&S.lastAuction?.winner===i?'won':''}"><strong>${esc(p.name)}</strong>${auctionCardHTML(revealed?S.bids[i]:null,i)}<span>${revealed?S.lastAuction?.winner===i?'+'+S.lastAuction.pot+' points':'Carte '+S.bids[i].rank:S.bids[i]?'Choix verrouillé':'En réflexion'}</span></div>`).join('')}</div><p class="auction-message" role="status">${revealed?esc(S.message):'Les valeurs seront révélées quand tout le monde aura choisi.'}</p>${!revealed&&S.lastAuction?`<details class="auction-history"><summary>Enchère précédente</summary><p>${S.lastAuction.cards.map((c,i)=>esc(S.players[i].name)+' : '+c.rank).join(' · ')}</p></details>`:''}</section>`;}
 const total=S.boxDice.reduce((a,b)=>a+b,0),selected=[...selection].map(Number),sum=selected.reduce((a,b)=>a+b,0);return `<section class="felt box-table" aria-label="La boîte à fermer"><div class="auction-top"><span>Passage ${S.boxRound} / 3</span><span>${esc(S.players[S.boxOwner].name)}</span></div><div class="box-tiles" role="group" aria-label="Nombres à fermer">${Array.from({length:9},(_,i)=>i+1).map(n=>{const closed=!S.boxNumbers.includes(n);return `<button type="button" class="box-tile ${closed?'closed':''} ${selection.has(String(n))?'selected':''}" data-action="box-select" data-number="${n}" ${closed||!canPlay()||S.boxStage!=='choose'?'disabled':''} aria-label="${n}${closed?', fermé':''}" aria-pressed="${selection.has(String(n))}">${n}${closed?'<small>✓</small>':''}</button>`;}).join('')}</div><div class="box-dice">${S.boxDice.map(n=>dieHTML(n)).join('')||'<span>Les dés vous attendent</span>'}</div><p class="box-total" role="status">${S.phase!=='play'?esc(S.message):S.boxStage==='choose'?'Somme choisie : '+sum+' / '+total:'Il reste '+S.boxNumbers.reduce((a,b)=>a+b,0)+' points dans la boîte.'}</p><p class="box-hint">${S.boxNumbers.every(n=>n<7)?'7, 8 et 9 sont fermés : vous pouvez choisir un seul dé.':'Fermez 7, 8 et 9 pour pouvoir lancer un seul dé.'}</p></section>`;
};
handHTML=function(){if(!V16_IDS.includes(S?.id))return V16_HAND();if(S.id==='boite'||S.phase!=='play'||net.spectator)return '';const p=S.players[privateIndex()],mine=canPlay()&&privateIndex()===S.turn;return `<section class="hand-panel auction-hand" aria-label="Vos cartes d’enchère"><div class="hand-title">${esc(p.name)} · ${p.hand.length} cartes restantes</div><div class="auction-rack">${p.hand.map(c=>`<button type="button" class="auction-number ${selection.has(c.id)?'selected':''}" data-action="bid-select" data-id="${c.id}" ${mine?'':'disabled'} aria-label="Enchérir avec ${c.rank}" aria-pressed="${selection.has(c.id)}">${c.rank}</button>`).join('')}</div><p class="hand-help">Sélectionnez, puis confirmez. Chaque carte ne sert qu’une fois.</p></section>`;};
actionsHTML=function(){if(!V16_IDS.includes(S?.id))return V16_ACTIONS();if(S.phase==='roundEnd'){if(net.spectator||isOnline()&&net.me!==0)return '<p class="action-note">L’hôte va lancer la suite.</p>';return `<div class="action-zone">${button(S.id==='encheres'?'Enchère suivante':'Passage suivant','nextRound',{},isOnline()&&(!net.connected||net.pending||netPaused()))}</div>`;}if(!canPlay())return `<p class="action-note">${esc(net.spectator?'Vous observez la partie.':isOnline()?onlineWaitingText():player(S).name+' joue…')}</p>`;if(S.id==='encheres'){const c=player(S).hand.find(c=>selection.has(c.id));return `<div class="action-zone">${button(c?'Confirmer la carte '+c.rank:'Choisir une carte','bid',{id:c?.id||''},!c)}</div>`;}if(S.boxStage==='roll')return `<div class="action-zone">${button('Lancer deux dés','roll',{count:2})}${S.boxNumbers.every(n=>n<7)?button('Lancer un dé','roll',{count:1},false,'secondary'):''}</div>`;const numbers=[...selection].map(Number),total=S.boxDice.reduce((a,b)=>a+b,0);return `<div class="action-zone">${button('Fermer les nombres choisis','close',{numbers},!numbers.length||numbers.reduce((a,b)=>a+b,0)!==total)}</div>`;};
winHTML=function(){const html=V16_WIN();return V16_IDS.includes(S?.id)?html.replace('Points restants',S.id==='boite'?'Total · le plus petit gagne':'Points remportés'):html;};
refreshSelection=function(){if(!V16_IDS.includes(S?.id))return V16_REFRESH();document.querySelectorAll('[data-action="bid-select"],[data-action="box-select"]').forEach(b=>{const chosen=selection.has(b.dataset.id||b.dataset.number);b.classList.toggle('selected',chosen);b.setAttribute('aria-pressed',String(chosen));});if(S.id==='boite'&&document.querySelector('.box-total'))document.querySelector('.box-total').textContent='Somme choisie : '+[...selection].reduce((a,b)=>a+Number(b),0)+' / '+S.boxDice.reduce((a,b)=>a+b,0);if($('game-actions'))patchMarkup($('game-actions'),actionsHTML());};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||!canPlay())return;if(b.dataset.action==='bid-select'&&S.id==='encheres'){const selected=selection.has(b.dataset.id);selection.clear();if(!selected)selection.add(b.dataset.id);refreshSelection();}if(b.dataset.action==='box-select'&&S.id==='boite'){const n=b.dataset.number;if(selection.has(n))selection.delete(n);else selection.add(n);refreshSelection();}});
document.addEventListener('keydown',e=>{if(!V16_IDS.includes(S?.id)||!canPlay()||$('dialog').open||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const selector=S.id==='encheres'?'[data-action="bid-select"]':'[data-action="box-select"]:not(:disabled)',cards=[...document.querySelectorAll(selector)],i=cards.indexOf(e.target);if(i<0)return;e.preventDefault();cards[e.key==='Home'?0:e.key==='End'?cards.length-1:(i+(e.key==='ArrowRight'?1:-1)+cards.length)%cards.length]?.focus();});
playSceneAction=function(ctx){V16_SCENE(ctx);if(!ctx||ctx.id!==S?.id||!motionOn()||gate)return;if(S.id==='encheres'&&ctx.type==='bid'&&S.phase!=='play')document.querySelectorAll('.auction-bids .auction-number').forEach((el,i)=>uiAnimate(el,[{transform:'rotateY(90deg)',opacity:0},{transform:'rotateY(0)',opacity:1}],{duration:motionDuration(500),delay:motionDuration(i*65),easing:MOTION_SOFT},'auction-reveal'));if(S.id==='boite'&&ctx.type==='roll')document.querySelectorAll('.box-dice .die').forEach((el,i)=>uiAnimate(el,[{transform:'translateY(-15px) rotate(-28deg)'},{transform:'translateY(3px) rotate(14deg)',offset:.6},{transform:'none'}],{duration:motionDuration(550),delay:i*65,easing:MOTION_SOFT},'box-roll'));};

validateSaved();applyPrefs();showHome();bootOnlineInvite();musicMount();
